<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM-JTE | Sistem Manajemen Administrasi JTE</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sidebar-active { background-color: rgba(255, 255, 255, 0.15); border-left: 4px solid #6366f1; }
        .nav-tab-active { border-bottom: 3px solid #2563eb; color: #1d4ed8; font-weight: 700; background-color: #ffffff; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased">

    <!-- APP CONTAINER -->
    <div id="app" class="min-h-screen flex flex-col">
        
        <!-- LOGIN VIEW -->
        <div id="login-view" class="flex-1 flex items-center justify-center p-4 bg-slate-900">
            <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8 border border-slate-200">
                <div class="text-center mb-6">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-100 text-indigo-600 mb-4">
                        <i class="fa-solid fa-bolt text-3xl"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-slate-900">SIM-JTE System</h1>
                    <p class="text-xs text-slate-500 mt-1">Jurusan Teknologi Elektro</p>
                </div>

                <div id="db-status" class="mb-5 p-2.5 rounded-lg bg-amber-50 text-amber-700 text-xs font-semibold flex items-center justify-between border border-amber-200">
                    <span><i class="fa-solid fa-spinner fa-spin mr-2"></i> Menghubungkan ke Firestore...</span>
                </div>

                <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-user"></i></span>
                            <input type="text" id="login-username" required class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none transition text-sm" placeholder="Username terdaftar">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="login-password" required class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none transition text-sm" placeholder="••••••••">
                        </div>
                    </div>

                    <div id="login-error" class="hidden p-3 rounded-lg bg-red-50 text-red-600 text-xs font-medium border border-red-200">
                        Username atau password salah / tidak ditemukan.
                    </div>

                    <button type="submit" id="btn-login" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md transition duration-200">
                        Masuk ke Sistem
                    </button>
                </form>
            </div>
        </div>

        <!-- MAIN DASHBOARD VIEW -->
        <div id="dashboard-view" class="hidden flex-1 flex flex-col md:flex-row min-h-screen">
            <aside class="w-full md:w-64 bg-slate-900 text-slate-300 flex flex-col justify-between shrink-0">
                <div>
                    <div class="p-5 flex items-center space-x-3 border-b border-slate-800">
                        <i class="fa-solid fa-bolt text-indigo-400 text-2xl"></i>
                        <div>
                            <h2 class="font-bold text-white leading-none">SIM-JTE</h2>
                            <span class="text-xs text-slate-400">Teknologi Elektro</span>
                        </div>
                    </div>
                    <nav class="p-3 space-y-1 text-sm font-medium" id="sidebar-menu"></nav>
                </div>

                <div class="p-4 border-t border-slate-800 bg-slate-950/50">
                    <div class="flex items-center space-x-3 mb-3">
                        <div class="w-9 h-9 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold shrink-0" id="user-avatar">U</div>
                        <div class="overflow-hidden">
                            <p class="text-sm font-semibold text-white truncate" id="user-display-name">User Name</p>
                            <p class="text-[11px] text-slate-400 truncate" id="user-username">@username</p>
                            <div class="flex flex-wrap gap-1 mt-1.5" id="user-roles-badges"></div>
                        </div>
                    </div>
                    <button onclick="handleLogout()" class="w-full py-2 px-3 bg-red-600/20 hover:bg-red-600 text-red-300 hover:text-white rounded-lg text-xs font-semibold flex items-center justify-center space-x-2 transition">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Keluar Sistem</span>
                    </button>
                </div>
            </aside>

            <main class="flex-1 bg-slate-50 flex flex-col overflow-y-auto">
                <header class="bg-white border-b border-slate-200 py-4 px-6 flex items-center justify-between sticky top-0 z-10 shadow-sm">
                    <div>
                        <h1 class="text-xl font-bold text-slate-800" id="page-title">Dashboard Overview</h1>
                        <p class="text-xs text-slate-500" id="user-context-info">Sistem Terintegrasi</p>
                    </div>
                    <span class="text-xs bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full font-semibold border border-indigo-200">
                        T.A. 2026/2027 - Ganjil
                    </span>
                </header>
                <div class="p-6 flex-1" id="main-content"></div>
            </main>
        </div>
    </div>

    <!-- GLOBAL MODAL CONTAINER -->
    <div id="modal-container" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-xl w-full overflow-hidden border border-slate-200 transform transition-all" id="modal-content"></div>
    </div>

    <!-- FIREBASE MODULE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4RAHwt54aAQGD0GWEMkKpi94VdHG7kzY",
            authDomain: "sim-jte.firebaseapp.com",
            projectId: "sim-jte",
            storageBucket: "sim-jte.firebasestorage.app",
            messagingSenderId: "931452325709",
            appId: "1:931452325709:web:576faf724835bb712fb104",
            measurementId: "G-KKHDV3DMCY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = null;
        let activeTab = 'tab_1';

        function hasAnyRole(allowedRoles) {
            if (!currentUser || !currentUser.roles) return false;
            return currentUser.roles.some(role => allowedRoles.includes(role));
        }

        async function checkFirebaseConnection() {
            const statusDiv = document.getElementById('db-status');
            try {
                await getDocs(query(collection(db, "users")));
                statusDiv.className = "mb-5 p-2.5 rounded-lg bg-emerald-50 text-emerald-700 text-xs font-semibold flex items-center justify-between border border-emerald-200";
                statusDiv.innerHTML = '<span><i class="fa-solid fa-circle-check mr-2"></i> Cloud Firestore DB Terhubung</span>';
            } catch (err) {
                statusDiv.className = "mb-5 p-2.5 rounded-lg bg-red-50 text-red-700 text-xs font-semibold border border-red-200";
                statusDiv.innerHTML = `<span><i class="fa-solid fa-triangle-exclamation mr-2"></i> Koneksi Database Gagal.</span>`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            checkFirebaseConnection();
            const savedUser = localStorage.getItem('sim_jte_session');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                showDashboard();
            }
        });

        window.handleLogin = async function(e) {
            e.preventDefault();
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();
            const errDiv = document.getElementById('login-error');
            const btnLogin = document.getElementById('btn-login');

            btnLogin.disabled = true;
            btnLogin.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Memeriksa Database...';

            try {
                const q = query(collection(db, "users"), where("username", "==", u), where("password", "==", p));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    currentUser = querySnapshot.docs[0].data();
                    errDiv.classList.add('hidden');
                    localStorage.setItem('sim_jte_session', JSON.stringify(currentUser));
                    showDashboard();
                } else {
                    errDiv.classList.remove('hidden');
                }
            } catch (error) {
                alert("Gagal autentikasi: " + error.message);
            } finally {
                btnLogin.disabled = false;
                btnLogin.innerText = 'Masuk ke Sistem';
            }
        };

        window.handleLogout = function() {
            localStorage.removeItem('sim_jte_session');
            currentUser = null;
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
        };

        function renderSidebar() {
            const menu = document.getElementById('sidebar-menu');
            let items = [];

            items.push({ id: 'overview', label: 'Dashboard Overview', icon: 'fa-chart-pie' });
            items.push({ id: 'documents', label: 'Dokumen Jurusan', icon: 'fa-folder-open' });

            if (hasAnyRole(['dosen'])) {
                items.push({ id: 'my_schedules', label: 'Jadwal Mengajar Saya', icon: 'fa-calendar-user' });
                items.push({ id: 'my_bkd', label: 'BKD Personal', icon: 'fa-user-clock' });
                items.push({ id: 'research', label: 'Penelitian & PKM', icon: 'fa-flask' });
            }

            items.push({ id: 'baterai_program', label: 'Program BATERAI', icon: 'fa-hand-holding-hand' });

            if (hasAnyRole(['kaprodi'])) {
                items.push({ id: 'manage_schedules', label: 'Plotting Jadwal Prodi', icon: 'fa-calendar-days' });
                items.push({ id: 'achievements', label: 'Prestasi Mhs Prodi', icon: 'fa-trophy' });
            }

            if (hasAnyRole(['admin', 'superadmin'])) {
                items.push({ id: 'users', label: 'Manajemen User & Role', icon: 'fa-users-gear' });
            }

            if (hasAnyRole(['superadmin'])) {
                items.push({ id: 'periode_beasiswa', label: 'Master Periode Beasiswa', icon: 'fa-calendar-range' });
                items.push({ id: 'master_prodi', label: 'Master Prodi', icon: 'fa-sitemap' });
            }

            menu.innerHTML = items.map(item => `
                <button onclick="navigate('${item.id}')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg transition hover:bg-slate-800 text-left">
                    <i class="fa-solid ${item.icon} w-5 text-indigo-400"></i>
                    <span>${item.label}</span>
                </button>
            `).join('');
        }

        function showDashboard() {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');

            document.getElementById('user-display-name').textContent = currentUser.full_name || currentUser.nama;
            document.getElementById('user-username').textContent = `@${currentUser.username}`;
            document.getElementById('user-avatar').textContent = (currentUser.full_name || currentUser.nama) ? (currentUser.full_name || currentUser.nama).charAt(0) : 'U';
            document.getElementById('user-context-info').textContent = `Unit: ${currentUser.prodi || 'Jurusan'}`;

            const badgeContainer = document.getElementById('user-roles-badges');
            badgeContainer.innerHTML = (currentUser.roles || [currentUser.role]).map(r => `
                <span class="px-2 py-0.5 rounded bg-indigo-900/80 text-indigo-200 text-[10px] font-bold uppercase tracking-wider border border-indigo-700/50">${r}</span>
            `).join('');

            renderSidebar();
            navigate('baterai_program');
        }

        window.closeModal = function() {
            document.getElementById('modal-container').classList.add('hidden');
        };

        window.openModal = function(htmlContent) {
            document.getElementById('modal-content').innerHTML = htmlContent;
            document.getElementById('modal-container').classList.remove('hidden');
        };

        // ROUTER SYSTEM
        window.navigate = async function(pageId) {
            const container = document.getElementById('main-content');
            const title = document.getElementById('page-title');

            if (pageId === 'baterai_program') {
                title.textContent = "BATERAI - Jurusan Teknologi Elektro";
                renderBateraiModule(container);
            } else if (pageId === 'overview') {
                title.textContent = "Dashboard Overview";
                container.innerHTML = `<div class="p-6 bg-white rounded-2xl border border-slate-200 shadow-sm">Selamat Datang di SIM-JTE Dashboard.</div>`;
            } else if (pageId === 'users') {
                title.textContent = "Manajemen User & Hak Akses (RBAC)";
                renderUsersManagement(container);
            } else {
                title.textContent = pageId.replace('_', ' ').toUpperCase();
                container.innerHTML = `<div class="p-6 bg-white rounded-2xl border border-slate-200 shadow-sm">Modul <b>${pageId}</b> terhubung langsung dengan Firestore.</div>`;
            }
        };

        // RENDERER MODUL BATERAI BERDASARKAN ROLE
        async function renderBateraiModule(container) {
            let totalMasuk = 0;
            let totalKeluar = 0;
            let userTotalIuran = 0;

            try {
                const iuranSnap = await getDocs(collection(db, "baterai_iuran"));
                const alokasiSnap = await getDocs(collection(db, "baterai_alokasi"));

                iuranSnap.forEach(doc => {
                    const d = doc.data();
                    const sum = Number(d.jumlah || 0);
                    totalMasuk += sum;
                    if (d.username === currentUser.username || d.nama === (currentUser.full_name || currentUser.nama)) {
                        userTotalIuran += sum;
                    }
                });

                alokasiSnap.forEach(doc => { totalKeluar += Number(doc.data().nominal || 0); });
            } catch(e) { console.error(e); }

            const saldoKas = totalMasuk - totalKeluar;
            const isAdmin = hasAnyRole(['admin', 'superadmin']);

            // HEADER STATS & REKENING (SAMA UNTUK SEMUA ROLE)
            let headerHTML = `
                <!-- REKENING TRANSFER BANNER -->
                <div class="mb-4 p-3.5 bg-sky-100 border border-sky-300 rounded-xl text-xs text-slate-800 flex items-center space-x-3 shadow-sm">
                    <div class="w-8 h-8 rounded-lg bg-sky-200 text-sky-700 flex items-center justify-center shrink-0 text-base">
                        <i class="fa-solid fa-building-columns"></i>
                    </div>
                    <div>
                        <p class="font-bold text-sky-900"><i class="fa-regular fa-credit-card mr-1"></i> Rekening Transfer Iuran (Bank MANDIRI)</p>
                        <p class="mt-0.5">Bank MANDIRI &bull; Nomor Rekening: <span class="bg-blue-600 text-white font-bold px-2 py-0.5 rounded text-[11px]">1400020926979</span> &bull; a.n. <strong>Siti Aminah</strong></p>
                    </div>
                </div>
            `;

            if (isAdmin) {
                // TAMPILAN 3 CARDS METRIC ROLE ADMIN (GAMBAR 1-5)
                headerHTML += `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5">
                        <div class="p-4 bg-emerald-600 text-white rounded-2xl shadow-sm">
                            <p class="text-xs font-semibold opacity-90">Total Pemasukan Kas</p>
                            <p class="text-2xl font-extrabold mt-1">Rp ${totalMasuk.toLocaleString('id-ID')}</p>
                        </div>
                        <div class="p-4 bg-rose-600 text-white rounded-2xl shadow-sm">
                            <p class="text-xs font-semibold opacity-90">Total Pengeluaran Kas</p>
                            <p class="text-2xl font-extrabold mt-1">Rp ${totalKeluar.toLocaleString('id-ID')}</p>
                        </div>
                        <div class="p-4 bg-blue-600 text-white rounded-2xl shadow-sm">
                            <p class="text-xs font-semibold opacity-90">Saldo Akhir Kas Keseluruhan</p>
                            <p class="text-2xl font-extrabold mt-1">Rp ${saldoKas.toLocaleString('id-ID')}</p>
                        </div>
                    </div>
                `;
            } else {
                // TAMPILAN REMINDER & CARDS METRIC ROLE DOSEN/TENDIK (GAMBAR 1-3)
                headerHTML += `
                    <div class="mb-4 p-3.5 bg-red-100 border border-red-300 rounded-xl text-xs text-red-900 flex items-center space-x-3 shadow-sm">
                        <div class="w-8 h-8 rounded-lg bg-red-200 text-red-700 flex items-center justify-center shrink-0 text-base">
                            <i class="fa-solid fa-triangle-exclamation text-red-600"></i>
                        </div>
                        <div>
                            <p class="font-bold text-red-700 uppercase tracking-wide"><i class="fa-solid fa-bell mr-1"></i> Perhatian Khusus</p>
                            <p class="mt-0.5">Anda tercatat belum melakukan pembayaran bulan <strong>(Oktober 2026)</strong>. Anda dapat melakukan pembayaran pada nomor rekening di atas.</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
                        <div class="p-4 bg-emerald-600 text-white rounded-2xl shadow-sm">
                            <p class="text-xs font-semibold opacity-90">Total Iuran Anda</p>
                            <p class="text-2xl font-extrabold mt-1">Rp ${userTotalIuran.toLocaleString('id-ID')}</p>
                        </div>
                        <div class="p-4 bg-blue-600 text-white rounded-2xl shadow-sm">
                            <p class="text-xs font-semibold opacity-90">Saldo Akhir Kas Keseluruhan</p>
                            <p class="text-2xl font-extrabold mt-1">Rp ${saldoKas.toLocaleString('id-ID')}</p>
                        </div>
                    </div>
                `;
            }

            // DYNAMIC TABS NAV
            let tabsNavHTML = '';
            if (isAdmin) {
                tabsNavHTML = `
                    <button onclick="switchTab('tab_1')" id="nav-tab_1" class="px-4 py-3 transition ${activeTab === 'tab_1' ? 'nav-tab-active' : 'hover:text-slate-900'}">Riwayat Iuran</button>
                    <button onclick="switchTab('tab_2')" id="nav-tab_2" class="px-4 py-3 transition flex items-center space-x-1.5 ${activeTab === 'tab_2' ? 'nav-tab-active' : 'hover:text-slate-900'}"><i class="fa-solid fa-table-cells text-blue-500"></i><span>Monitor Iuran</span></button>
                    <button onclick="switchTab('tab_3')" id="nav-tab_3" class="px-4 py-3 transition ${activeTab === 'tab_3' ? 'nav-tab-active' : 'hover:text-slate-900'}">Input Iuran / Rapel</button>
                    <button onclick="switchTab('tab_4')" id="nav-tab_4" class="px-4 py-3 transition ${activeTab === 'tab_4' ? 'nav-tab-active' : 'hover:text-slate-900'}">Pengelolaan Dana Beasiswa</button>
                    <button onclick="switchTab('tab_5')" id="nav-tab_5" class="px-4 py-3 transition ${activeTab === 'tab_5' ? 'nav-tab-active' : 'hover:text-slate-900'}">Laporan Keuangan</button>
                `;
            } else {
                tabsNavHTML = `
                    <button onclick="switchTab('tab_1')" id="nav-tab_1" class="px-4 py-3 transition ${activeTab === 'tab_1' ? 'nav-tab-active' : 'hover:text-slate-900'}">Riwayat Pembayaran</button>
                    <button onclick="switchTab('tab_2')" id="nav-tab_2" class="px-4 py-3 transition flex items-center space-x-1.5 ${activeTab === 'tab_2' ? 'nav-tab-active' : 'hover:text-slate-900'}"><i class="fa-solid fa-table-cells text-blue-500"></i><span>Monitor Iuran Per Tahun</span></button>
                    <button onclick="switchTab('tab_3')" id="nav-tab_3" class="px-4 py-3 transition ${activeTab === 'tab_3' ? 'nav-tab-active' : 'hover:text-slate-900'}">Riwayat Beasiswa</button>
                    <button onclick="switchTab('tab_4')" id="nav-tab_4" class="px-4 py-3 transition flex items-center space-x-1.5 ${activeTab === 'tab_4' ? 'nav-tab-active' : 'hover:text-slate-900'}"><i class="fa-solid fa-graduation-cap text-indigo-500"></i><span>Usulan Beasiswa Mahasiswa</span></button>
                `;
            }

            container.innerHTML = `
                ${headerHTML}

                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="flex border-b border-slate-200 bg-slate-50/50 text-xs font-semibold text-slate-600 overflow-x-auto">
                        ${tabsNavHTML}
                    </div>
                    <div class="p-6" id="baterai-tab-body"></div>
                </div>
            `;

            renderTabBodyContent();
        }

        window.switchTab = function(tabId) {
            activeTab = tabId;
            document.querySelectorAll('[id^="nav-tab_"]').forEach(btn => {
                btn.className = "px-4 py-3 transition flex items-center space-x-1.5 hover:text-slate-900";
            });
            const btnActive = document.getElementById(`nav-${tabId}`);
            if (btnActive) btnActive.className = "px-4 py-3 transition flex items-center space-x-1.5 nav-tab-active";
            renderTabBodyContent();
        };

        async function renderTabBodyContent() {
            const body = document.getElementById('baterai-tab-body');
            if (!body) return;

            const isAdmin = hasAnyRole(['admin', 'superadmin']);

            if (isAdmin) {
                // ==================== ROLE ADMIN ====================
                if (activeTab === 'tab_1') { // RIWAYAT IURAN (GAMBAR 1)
                    body.innerHTML = `
                        <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-3 text-xs">
                            <div class="flex items-center space-x-2"><span>Tampilkan:</span><select class="px-2 py-1 border rounded"><option>5</option></select><span>baris per halaman</span></div>
                            <div class="relative w-full md:w-64"><input type="text" placeholder="Cari data..." class="w-full pl-8 pr-3 py-1.5 border rounded-lg text-xs outline-none"><i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2 text-slate-400"></i></div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="border-b bg-slate-50 font-bold text-slate-700">
                                        <th class="p-3">ID <i class="fa-solid fa-arrow-up-long text-slate-400"></i></th>
                                        <th class="p-3">Nama Penyumbang <i class="fa-solid fa-arrow-up-long text-slate-400"></i></th>
                                        <th class="p-3">Tanggal <i class="fa-solid fa-arrow-up-long text-slate-400"></i></th>
                                        <th class="p-3">Periode <i class="fa-solid fa-arrow-up-long text-slate-400"></i></th>
                                        <th class="p-3">Jumlah <i class="fa-solid fa-arrow-up-long text-slate-400"></i></th>
                                        <th class="p-3 text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="tbody-riwayat-iuran" class="divide-y">
                                    <tr><td colspan="6" class="p-4 text-center text-slate-400">Memuat data iuran...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    `;

                    try {
                        const snap = await getDocs(collection(db, "baterai_iuran"));
                        const tbody = document.getElementById('tbody-riwayat-iuran');
                        if (snap.empty) {
                            tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">Belum ada transaksi iuran.</td></tr>`;
                        } else {
                            tbody.innerHTML = snap.docs.map(doc => {
                                const d = doc.data();
                                return `
                                    <tr>
                                        <td class="p-3 font-medium">TRX-${doc.id.substring(0, 10).toUpperCase()}</td>

        // SUBMIT ACTIONS
        window.submitIuranAdmin = async function(e) {
            e.preventDefault();
            const months = Array.from(document.querySelectorAll('#month-checkboxes input:checked')).map(c => c.value);
            if (months.length === 0) return alert("Pilih minimal satu bulan!");

            const nama = document.getElementById('pay-user').value.split(' (')[0];
            const nominal = parseFloat(document.getElementById('pay-nominal').value);
            const tahun = document.getElementById('pay-tahun').value;

            try {
                for (let bulan of months) {
                    await addDoc(collection(db, "baterai_iuran"), {
                        nama: nama, bulan: bulan, tahun: tahun, jumlah: nominal,
                        tanggal: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })
                    });
                }
                alert("Iuran berhasil disimpan!");
                renderBateraiModule(document.getElementById('main-content'));
            } catch(err) { alert("Gagal menyimpan: " + err.message); }
        };

        window.submitCairkanBeasiswa = async function(e) {
            e.preventDefault();
            try {
                await addDoc(collection(db, "baterai_alokasi"), {
                    nrp: document.getElementById('alk-nrp').value.trim(),
                    mahasiswa: document.getElementById('alk-nama').value.trim(),
                    prodi: document.getElementById('alk-prodi').value,
                    nominal: parseFloat(document.getElementById('alk-nominal').value),
                    periode: `${document.getElementById('alk-sem').value} ${document.getElementById('alk-thn').value}`,
                    created_at: new Date()
                });
                alert("Pencairan beasiswa berhasil disimpan!");
                renderBateraiModule(document.getElementById('main-content'));
            } catch(err) { alert("Gagal menyimpan: " + err.message); }
        };

        window.deleteDocItem = async function(coll, id) {
            if (confirm("Hapus data ini dari database Firestore?")) {
                try {
                    await deleteDoc(doc(db, coll, id));
                    alert("Data berhasil dihapus!");
                    renderBateraiModule(document.getElementById('main-content'));
                } catch(e) { alert("Gagal menghapus: " + e.message); }
            }
        };

        function renderUsersManagement(container) {
            container.innerHTML = `<div class="p-6 bg-white rounded-2xl border border-slate-200 shadow-sm">Modul Manajemen User SIM-JTE Terhubung Firestore.</div>`;
