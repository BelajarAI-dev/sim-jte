<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM-JTE | Sistem Terpadu BATERAI Jurusan Teknologi Elektro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- jsPDF & autoTable CDN untuk cetak laporan PDF langsung di client side -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        .sidebar-active { background-color: rgba(255, 255, 255, 0.15); border-left: 4px solid #6366f1; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased">

    <div id="app" class="min-h-screen flex flex-col">
        
        <!-- LOGIN VIEW -->
        <div id="login-view" class="flex-1 flex items-center justify-center p-4 bg-slate-900">
            <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8 border border-slate-200">
                <div class="text-center mb-6">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-100 text-indigo-600 mb-4">
                        <i class="fa-solid fa-bolt text-3xl text-amber-500"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-slate-900">SIM-JTE System</h1>
                    <p class="text-xs text-indigo-600 font-semibold mt-1">BATERAI - Beasiswa Akademis Teknologi Elektro untuk Riset & Akselerasi Inovatif</p>
                </div>

                <!-- STATUS DB FIRESTORE -->
                <div id="db-status" class="mb-5 p-2.5 rounded-lg bg-amber-50 text-amber-700 text-xs font-semibold flex items-center justify-between border border-amber-200">
                    <span><i class="fa-solid fa-spinner fa-spin mr-2"></i> Menghubungkan ke Cloud Firestore...</span>
                </div>

                <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Username / NRP / NIP</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-user"></i></span>
                            <input type="text" id="login-username" required class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm" placeholder="Username / NRP / NIP">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="login-password" required class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm" placeholder="••••••••">
                        </div>
                    </div>

                    <div id="login-error" class="hidden p-3 rounded-lg bg-red-50 text-red-600 text-xs font-medium border border-red-200">
                        Username atau password salah / Akun belum diaktivasi!
                    </div>

                    <button type="submit" id="btn-login" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md transition">
                        Masuk Sistem
                    </button>

                    <button type="button" onclick="openRegisterMhsModal()" class="w-full py-2.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-300 font-semibold rounded-lg text-xs transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-user-plus"></i>
                        <span>Daftar Akun Beasiswa Mahasiswa</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- MAIN DASHBOARD VIEW -->
        <div id="dashboard-view" class="hidden flex-1 flex flex-col md:flex-row min-h-screen">
            <aside class="w-full md:w-64 bg-slate-900 text-slate-300 flex flex-col justify-between shrink-0">
                <div>
                    <div class="p-5 flex items-center space-x-3 border-b border-slate-800">
                        <i class="fa-solid fa-bolt text-amber-400 text-2xl"></i>
                        <div>
                            <h2 class="font-bold text-white leading-none">SIM-JTE</h2>
                            <span class="text-[11px] text-indigo-300">Program BATERAI</span>
                        </div>
                    </div>
                    <nav class="p-3 space-y-1 text-sm font-medium" id="sidebar-menu"></nav>
                </div>

                <div class="p-4 border-t border-slate-800 bg-slate-950/50">
                    <div class="flex items-center space-x-3 mb-3">
                        <div class="w-9 h-9 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold shrink-0" id="user-avatar">U</div>
                        <div class="overflow-hidden">
                            <p class="text-sm font-semibold text-white truncate" id="user-display-name">User Name</p>
                            <p class="text-[11px] text-slate-400 truncate" id="user-username">@username</p>
                            <div class="flex flex-wrap gap-1 mt-1.5" id="user-roles-badges"></div>
                        </div>
                    </div>
                    <button onclick="handleLogout()" class="w-full py-2 px-3 bg-red-600/20 hover:bg-red-600 text-red-300 hover:text-white rounded-lg text-xs font-semibold flex items-center justify-center space-x-2 transition">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Keluar Sistem</span>
                    </button>
                </div>
            </aside>

            <main class="flex-1 bg-slate-50 flex flex-col overflow-y-auto">
                <header class="bg-white border-b border-slate-200 py-4 px-6 flex items-center justify-between sticky top-0 z-10 shadow-sm">
                    <div>
                        <h1 class="text-xl font-bold text-slate-800" id="page-title">Program BATERAI</h1>
                        <p class="text-xs text-slate-500" id="user-context-info">Sistem Terintegrasi JTE</p>
                    </div>
                    <span class="text-xs bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full font-semibold border border-indigo-200" id="active-periode-header">
                        Periode: Memuat...
                    </span>
                </header>
                <div class="p-6 flex-1" id="main-content"></div>
            </main>
        </div>
    </div>

    <!-- GLOBAL MODAL CONTAINER -->
    <div id="modal-container" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full overflow-hidden border border-slate-200 transform transition-all" id="modal-content"></div>
    </div>

    <!-- FIREBASE MODULE LOGIC & APPLICATION ENGINE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4RAHwt54aAQGD0GWEMkKpi94VdHG7kzY",
            authDomain: "sim-jte.firebaseapp.com",
            projectId: "sim-jte",
            storageBucket: "sim-jte.firebasestorage.app",
            messagingSenderId: "931452325709",
            appId: "1:931452325709:web:576faf724835bb712fb104",
            measurementId: "G-KKHDV3DMCY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = null;
        let activePeriodeObj = null;
        const WA_ADMIN_NUMBER = "6281234567890";

        function hasAnyRole(allowedRoles) {
            if (!currentUser || !currentUser.roles) return false;
            return currentUser.roles.some(role => allowedRoles.includes(role));
        }

        async function checkFirebaseConnection() {
            const statusDiv = document.getElementById('db-status');
            try {
                await getDocs(collection(db, "users"));
                statusDiv.className = "mb-5 p-2.5 rounded-lg bg-emerald-50 text-emerald-700 text-xs font-semibold flex items-center justify-between border border-emerald-200";
                statusDiv.innerHTML = '<span><i class="fa-solid fa-circle-check mr-2"></i> Cloud Firestore Terhubung</span>';
            } catch (err) {
                console.error("Firestore error:", err);
                statusDiv.className = "mb-5 p-2.5 rounded-lg bg-red-50 text-red-700 text-xs font-semibold flex items-center justify-between border border-red-200";
                statusDiv.innerHTML = `<span><i class="fa-solid fa-triangle-exclamation mr-2"></i> Gagal terhubung ke Firestore</span>`;
            }
        }

        async function loadActivePeriode() {
            try {
                const q = query(collection(db, "periode"), where("isActive", "==", true));
                const snap = await getDocs(q);
                if (!snap.empty) {
                    activePeriodeObj = { id: snap.docs[0].id, ...snap.docs[0].data() };
                    document.getElementById('active-periode-header').innerText = `Periode: ${activePeriodeObj.nama_periode}`;
                } else {
                    activePeriodeObj = null;
                    document.getElementById('active-periode-header').innerText = `Periode: TIDAK ADA PERIODE AKTIF`;
                }
            } catch (e) {
                console.error("Error loading active period:", e);
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await checkFirebaseConnection();
            await loadActivePeriode();
            const savedUser = localStorage.getItem('sim_jte_session');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                showDashboard();
            }
        });

        window.handleLogin = async function(e) {
            e.preventDefault();
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();
            const errDiv = document.getElementById('login-error');
            const btnLogin = document.getElementById('btn-login');

            btnLogin.disabled = true;
            btnLogin.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Verifikasi database...';

            try {
                let userFound = null;

                // 1. Cek Tabel Users (Dosen/Tendik/Admin)
                const qUsers = query(collection(db, "users"), where("username", "==", u), where("password", "==", p));
                const snapUsers = await getDocs(qUsers);

                if (!snapUsers.empty) {
                    userFound = { id: snapUsers.docs[0].id, ...snapUsers.docs[0].data() };
                } else {
                    // 2. Cek Tabel Mahasiswa
                    const qMhs = query(collection(db, "mahasiswa"), where("username", "==", u), where("password", "==", p));
                    const snapMhs = await getDocs(qMhs);
                    if (!snapMhs.empty) {
                        const mhsData = snapMhs.docs[0].data();
                        if (mhsData.statusAkun !== 'Aktif') {
                            Swal.fire('Akun Belum Aktif', 'Akun Anda belum diaktivasi oleh Ibu Siti Aminah / Admin. Silakan konfirmasi via WhatsApp.', 'warning');
                            btnLogin.disabled = false;
                            btnLogin.innerText = 'Masuk Sistem';
                            return;
                        }
                        userFound = {
                            id: snapMhs.docs[0].id,
                            username: mhsData.username,
                            full_name: mhsData.nama_lengkap,
                            roles: ['mahasiswa'],
                            nrp: mhsData.nrp,
                            prodi: mhsData.prodi,
                            semester: mhsData.semester,
                            no_wa: mhsData.no_wa
                        };
                    }
                }

                if (userFound) {
                    currentUser = userFound;
                    errDiv.classList.add('hidden');
                    localStorage.setItem('sim_jte_session', JSON.stringify(currentUser));
                    showDashboard();
                } else {
                    errDiv.classList.remove('hidden');
                }
            } catch (error) {
                Swal.fire('Error Autentikasi', error.message, 'error');
            } finally {
                btnLogin.disabled = false;
                btnLogin.innerText = 'Masuk Sistem';
            }
        };

        window.handleLogout = function() {
            localStorage.removeItem('sim_jte_session');
            currentUser = null;
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
        };

        function renderSidebar() {
            const menu = document.getElementById('sidebar-menu');
            let items = [];

            items.push({ id: 'overview', label: 'Dashboard Utama', icon: 'fa-chart-pie' });

            if (hasAnyRole(['mahasiswa'])) {
                items.push({ id: 'mhs_baterai', label: 'Pengajuan BATERAI', icon: 'fa-graduation-cap' });
            }

            if (hasAnyRole(['dosen', 'tendik'])) {
                items.push({ id: 'dosen_baterai', label: 'Iuran BATERAI Saya', icon: 'fa-hand-holding-dollar' });
            }

            if (hasAnyRole(['admin', 'superadmin', 'kajur', 'sekjur', 'kaprodi'])) {
                items.push({ id: 'admin_baterai', label: 'Kelola BATERAI (Admin)', icon: 'fa-sliders' });
                items.push({ id: 'baterai_report', label: 'Laporan Keuangan', icon: 'fa-file-invoice-dollar' });
            }

            if (hasAnyRole(['superadmin', 'admin'])) {
                items.push({ id: 'manage_periode', label: 'Periode Beasiswa', icon: 'fa-calendar-days' });
                items.push({ id: 'manage_users', label: 'User & Role', icon: 'fa-users-gear' });
            }

            menu.innerHTML = items.map(item => `
                <button onclick="navigate('${item.id}')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg transition hover:bg-slate-800 text-left">
                    <i class="fa-solid ${item.icon} w-5 text-indigo-400"></i>
                    <span>${item.label}</span>
                </button>
            `).join('');
        }

        function showDashboard() {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');

            document.getElementById('user-display-name').textContent = currentUser.full_name || currentUser.nama;
            document.getElementById('user-username').textContent = `@${currentUser.username}`;
            document.getElementById('user-avatar').textContent = (currentUser.full_name || currentUser.nama || 'U').charAt(0);
            document.getElementById('user-context-info').textContent = `Prodi: ${currentUser.prodi || 'Jurusan Teknologi Elektro'}`;

            const badgeContainer = document.getElementById('user-roles-badges');
            badgeContainer.innerHTML = (currentUser.roles || []).map(r => `
                <span class="px-2 py-0.5 rounded bg-indigo-900 text-indigo-200 text-[10px] font-bold uppercase border border-indigo-700/50">${r}</span>
            `).join('');

            renderSidebar();
            navigate('overview');
        }

        window.closeModal = function() {
            document.getElementById('modal-container').classList.add('hidden');
        };

        window.openModal = function(htmlContent) {
            document.getElementById('modal-content').innerHTML = htmlContent;
            document.getElementById('modal-container').classList.remove('hidden');
        };

        // --- NAVIGATION ROUTER ---
        window.navigate = async function(pageId) {
            const container = document.getElementById('main-content');
            const title = document.getElementById('page-title');
            await loadActivePeriode();

            if (pageId === 'overview') {
                title.textContent = "Dashboard Overview BATERAI";
                container.innerHTML = `
                    <div class="p-6 bg-gradient-to-r from-indigo-900 to-indigo-700 text-white rounded-2xl shadow-md mb-6">
                        <span class="px-3 py-1 bg-indigo-500/30 border border-indigo-400/40 rounded-full text-[11px] font-bold uppercase tracking-wider text-indigo-200">BATERAI JTE</span>
                        <h2 class="text-2xl font-bold mt-2">Beasiswa Akademis Teknologi Elektro untuk Riset & Akselerasi Inovatif</h2>
                        <p class="text-xs text-indigo-100 mt-1 max-w-3xl">Program hibah swadaya yang didanai secara berkelanjutan melalui iuran kolektif Dosen dan Tendik Jurusan Teknologi Elektro untuk mendorong percepatan riset, tugas akhir, dan karya inovasi Mahasiswa.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-6">
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-semibold text-slate-500 uppercase">Total Kas Iuran Masuk</p>
                            <p class="text-2xl font-bold text-emerald-600 mt-1" id="stat-total-masuk">Rp ...</p>
                            <p class="text-[11px] text-slate-400 mt-1">Sumber: Iuran Rutin Dosen & Tendik</p>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-semibold text-slate-500 uppercase">Total Hibah Disalurkan</p>
                            <p class="text-2xl font-bold text-indigo-600 mt-1" id="stat-total-keluar">Rp ...</p>
                            <p class="text-[11px] text-slate-400 mt-1">Pencairan Dana Riset Mahasiswa</p>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-semibold text-slate-500 uppercase">Saldo Kas Akhir</p>
                            <p class="text-2xl font-bold text-amber-600 mt-1" id="stat-saldo-kas">Rp ...</p>
                            <p class="text-[11px] text-slate-400 mt-1">Siap dialokasikan untuk mahasiswa</p>
                        </div>
                    </div>
                `;

                try {
                    const snapIuran = await getDocs(collection(db, "iuran"));
                    const snapAlokasi = await getDocs(collection(db, "alokasi"));
                    let totalMasuk = 0, totalKeluar = 0;

                    snapIuran.forEach(doc => totalMasuk += Number(doc.data().jumlah || 0));
                    snapAlokasi.forEach(doc => totalKeluar += Number(doc.data().nominal || 0));

                    document.getElementById('stat-total-masuk').textContent = `Rp ${totalMasuk.toLocaleString('id-ID')}`;
                    document.getElementById('stat-total-keluar').textContent = `Rp ${totalKeluar.toLocaleString('id-ID')}`;
                    document.getElementById('stat-saldo-kas').textContent = `Rp ${(totalMasuk - totalKeluar).toLocaleString('id-ID')}`;
                } catch(e) { console.error(e); }

            } else if (pageId === 'mhs_baterai') {
                title.textContent = "Pendaftaran & Status Beasiswa Mahasiswa";
                
                let pendaftaranExisting = null;
                if (activePeriodeObj) {
                    const q = query(collection(db, "pendaftaran"), where("id_periode", "==", activePeriodeObj.id), where("nrp", "==", currentUser.nrp));
                    const snap = await getDocs(q);
                    if (!snap.empty) pendaftaranExisting = snap.docs[0].data();
                }

                container.innerHTML = `
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm mb-6">
                        <h3 class="font-bold text-slate-800 border-b pb-3 text-sm flex items-center justify-between">
                            <span><i class="fa-solid fa-id-card text-indigo-600 mr-2"></i> Data Mahasiswa Pendaftar</span>
                            <span class="text-xs font-semibold px-2.5 py-1 bg-emerald-100 text-emerald-800 rounded-full">Status Akun: Aktif</span>
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4 text-xs">
                            <div><span class="text-slate-400 block">NRP Mahasiswa:</span><span class="font-bold text-slate-800">${currentUser.nrp}</span></div>
                            <div><span class="text-slate-400 block">Nama Lengkap:</span><span class="font-bold text-slate-800">${currentUser.full_name}</span></div>
                            <div><span class="text-slate-400 block">Program Studi / Semester:</span><span class="font-bold text-slate-800">${currentUser.prodi} (Semester ${currentUser.semester})</span></div>
                        </div>
                    </div>

                    ${pendaftaranExisting ? `
                        <div class="p-6 rounded-xl border text-center ${pendaftaranExisting.statusBeasiswa === 'Diterima' ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-indigo-50 border-indigo-200 text-indigo-900'}">
                            <i class="fa-solid ${pendaftaranExisting.statusBeasiswa === 'Diterima' ? 'fa-circle-check text-emerald-600' : 'fa-clock text-indigo-600'} text-4xl mb-3"></i>
                            <h3 class="font-bold text-lg">Status Beasiswa: ${pendaftaranExisting.statusBeasiswa.toUpperCase()}</h3>
                            <p class="text-xs mt-1">Pendaftaran Anda pada periode <b>${activePeriodeObj ? activePeriodeObj.nama_periode : '-'}</b> telah tercatat.</p>
                            <div class="mt-4 text-xs font-medium">IPK: ${pendaftaranExisting.ipk} | IPS: ${pendaftaranExisting.ips} \vert{} UKT: Rp${Number(pendaftaranExisting.ukt).toLocaleString('id-ID')}</div>
                        </div>
                    ` : `
                        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                            <h3 class="font-bold text-slate-800 text-sm mb-1"><i class="fa-solid fa-file-arrow-up text-indigo-600 mr-2"></i> Pengisian Data Akademik & Berkas Beasiswa</h3>
                            <p class="text-xs text-slate-500 mb-4">Lengkapi IPK, IPS, nominal UKT, dan cantumkan tautan Google Drive / Cloud berkas formulir pendukung PDF Anda.</p>
                            
                            <form onsubmit="submitPendaftaranMhs(event)" class="space-y-4 text-xs">
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div>
                                        <label class="block font-semibold mb-1 text-slate-700">IPK Kumulatif</label>
                                        <input type="number" step="0.01" min="0" max="4" id="mhs-ipk" required placeholder="misal: 3.75" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                                    </div>
                                    <div>
                                        <label class="block font-semibold mb-1 text-slate-700">IPS Semester Berjalan</label>
                                        <input type="number" step="0.01" min="0" max="4" id="mhs-ips" required placeholder="misal: 3.80" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                                    </div>
                                    <div>
                                        <label class="block font-semibold mb-1 text-slate-700">Nominal UKT (Rp)</label>
                                        <input type="number" id="mhs-ukt" required placeholder="misal: 2500000" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                                    </div>
                                </div>
                                <div>
                                    <label class="block font-semibold mb-1 text-slate-700">Link Berkas PDF Pendaftaran (Google Drive / Cloud Link)</label>
                                    <input type="url" id="mhs-file-link" required placeholder="https://drive.google.com/file/d/..." class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                                    <p class="text-[11px] text-slate-400 mt-1">Gabungkan formulir pendaftaran dan berkas pendukung ke dalam 1 file PDF lalu bagikan tautan aksesnya.</p>
                                </div>
                                <button type="submit" id="btn-sub-mhs" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg text-xs transition">
                                    Kirim Pendaftaran Beasiswa
                                </button>
                            </form>
                        </div>
                    `}
                `;

            } else if (pageId === 'dosen_baterai') {
                title.textContent = "Informasi & Riwayat Iuran Personal";
                container.innerHTML = `
                    <div class="p-4 bg-indigo-50 border border-indigo-200 rounded-xl mb-6 text-xs text-indigo-900 flex items-center justify-between">
                        <div>
                            <p class="font-bold"><i class="fa-solid fa-building-columns mr-2"></i> Rekening Transfer Iuran Swadaya BATERAI JTE</p>

                prodi: currentUser.prodi,
                ipk: parseFloat(document.getElementById('mhs-ipk').value),
                ips: parseFloat(document.getElementById('mhs-ips').value),
                ukt: parseFloat(document.getElementById('mhs-ukt').value),

        window.exportBateraiPDFReport = async function() {
            const { jsPDF } = window.jspdf;
            const docPdf = new jsPDF();

            docPdf.setFontSize(14);
            docPdf.text("LAPORAN KEUANGAN BATERAI JTE", 105, 15, { align: "center" });
            docPdf.setFontSize(9);
            docPdf.text("(Beasiswa Akademis Teknologi Elektro untuk Riset & Akselerasi Inovatif)", 105, 21, { align: "center" });
            docPdf.text("Jurusan Teknologi Elektro", 105, 26, { align: "center" });

            const snapIuran = await getDocs(collection(db, "iuran"));
            const rowsIuran = [];
            let i = 1;
            snapIuran.forEach(docSnap => {
                const d = docSnap.data();
                rowsIuran.push([i++, d.nama_user || '-', `${d.bulan} ${d.tahun}`, `Rp ${Number(d.jumlah).toLocaleString('id-ID')}`]);
            });

            docPdf.autoTable({
                startY: 35,
                head: [['No', 'Nama Penyumbang', 'Periode', 'Jumlah']],
                body: rowsIuran
            });

            docPdf.save("Laporan_Keuangan_BATERAI_JTE.pdf");
