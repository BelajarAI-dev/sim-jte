<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM-JTE | Sistem Manajemen Administrasi Jurusan Teknologi Elektro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sidebar-active { background-color: rgba(255, 255, 255, 0.15); border-left: 4px solid #6366f1; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased">

    <!-- APP CONTAINER -->
    <div id="app" class="min-h-screen flex flex-col">
        
        <!-- LOGIN VIEW -->
        <div id="login-view" class="flex-1 flex items-center justify-center p-4 bg-slate-900">
            <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8 border border-slate-200">
                <div class="text-center mb-6">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-100 text-indigo-600 mb-4">
                        <i class="fa-solid fa-microchip text-3xl"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-slate-900">SIM-JTE System</h1>
                    <p class="text-sm text-slate-500 mt-1">Jurusan Teknologi Elektro</p>
                </div>

                <!-- FIREBASE CONNECTION STATUS BADGE -->
                <div id="db-status" class="mb-5 p-2.5 rounded-lg bg-amber-50 text-amber-700 text-xs font-semibold flex items-center justify-between border border-amber-200">
                    <span><i class="fa-solid fa-spinner fa-spin mr-2"></i> Menghubungkan ke Firebase...</span>
                </div>

                <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="fa-solid fa-user"></i>
                            </span>
                            <input type="text" id="login-username" required class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm" placeholder="Masukkan username terdaftar">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" id="login-password" required class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm" placeholder="••••••••">
                        </div>
                    </div>

                    <div id="login-error" class="hidden p-3 rounded-lg bg-red-50 text-red-600 text-xs font-medium border border-red-200">
                        Username atau password salah / tidak ditemukan.
                    </div>

                    <button type="submit" id="btn-login" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition duration-200">
                        Masuk ke Sistem
                    </button>
                </form>

                <!-- HELPER SEED BUTTON -->
                <div class="mt-6 border-t pt-4 text-center">
                    <button onclick="seedDatabase()" id="btn-seed" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 px-3 rounded-md font-medium transition">
                        <i class="fa-solid fa-database mr-1"></i> Isi Firestore dengan Sample Data User
                    </button>
                </div>
            </div>
        </div>

        <!-- MAIN DASHBOARD VIEW -->
        <div id="dashboard-view" class="hidden flex-1 flex flex-col md:flex-row min-h-screen">
            <aside class="w-full md:w-64 bg-slate-900 text-slate-300 flex flex-col justify-between shrink-0">
                <div>
                    <div class="p-5 flex items-center space-x-3 border-b border-slate-800">
                        <i class="fa-solid fa-bolt text-indigo-400 text-2xl"></i>
                        <div>
                            <h2 class="font-bold text-white leading-none">SIM-JTE</h2>
                            <span class="text-xs text-slate-400">Teknologi Elektro</span>
                        </div>
                    </div>
                    <!-- NAV MENU UTAMA -->
                    <nav class="p-3 space-y-1 text-sm font-medium" id="sidebar-menu"></nav>
                </div>

                <div class="p-4 border-t border-slate-800 bg-slate-950/50">
                    <div class="flex items-center space-x-3 mb-3">
                        <div class="w-9 h-9 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold shrink-0" id="user-avatar">U</div>
                        <div class="overflow-hidden">
                            <p class="text-sm font-semibold text-white truncate" id="user-display-name">User Name</p>
                            <p class="text-[11px] text-slate-400 truncate" id="user-username">@username</p>
                            <div class="flex flex-wrap gap-1 mt-1.5" id="user-roles-badges"></div>
                        </div>
                    </div>
                    <button onclick="handleLogout()" class="w-full py-2 px-3 bg-red-600/20 hover:bg-red-600 text-red-300 hover:text-white rounded-lg text-xs font-semibold flex items-center justify-center space-x-2 transition">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Keluar Sistem</span>
                    </button>
                </div>
            </aside>

            <main class="flex-1 bg-slate-50 flex flex-col overflow-y-auto">
                <header class="bg-white border-b border-slate-200 py-4 px-6 flex items-center justify-between sticky top-0 z-10 shadow-sm">
                    <div>
                        <h1 class="text-xl font-bold text-slate-800" id="page-title">Dashboard Overview</h1>
                        <p class="text-xs text-slate-500" id="user-context-info">Sistem Terintegrasi</p>
                    </div>
                    <span class="text-xs bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full font-semibold border border-indigo-200">
                        T.A. 2026/2027 - Ganjil
                    </span>
                </header>
                <div class="p-6 flex-1" id="main-content"></div>
            </main>
        </div>
    </div>

    <!-- GLOBAL MODAL CONTAINER -->
    <div id="modal-container" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-200 transform transition-all" id="modal-content">
            <!-- Dynamic Modal Content Inserted Here -->
        </div>
    </div>

    <!-- FIREBASE MODULE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4RAHwt54aAQGD0GWEMkKpi94VdHG7kzY",
            authDomain: "sim-jte.firebaseapp.com",
            projectId: "sim-jte",
            storageBucket: "sim-jte.firebasestorage.app",
            messagingSenderId: "931452325709",
            appId: "1:931452325709:web:576faf724835bb712fb104",
            measurementId: "G-KKHDV3DMCY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = null;

        function hasAnyRole(allowedRoles) {
            if (!currentUser || !currentUser.roles) return false;
            return currentUser.roles.some(role => allowedRoles.includes(role));
        }

        async function checkFirebaseConnection() {
            const statusDiv = document.getElementById('db-status');
            try {
                const q = query(collection(db, "users"));
                await getDocs(q);
                statusDiv.className = "mb-5 p-2.5 rounded-lg bg-emerald-50 text-emerald-700 text-xs font-semibold flex items-center justify-between border border-emerald-200";
                statusDiv.innerHTML = '<span><i class="fa-solid fa-circle-check mr-2"></i> Firebase Firestore Terhubung!</span>';
            } catch (err) {
                console.error("Firestore connection error:", err);
                statusDiv.className = "mb-5 p-2.5 rounded-lg bg-red-50 text-red-700 text-xs font-semibold flex items-center justify-between border border-red-200";
                statusDiv.innerHTML = `<span><i class="fa-solid fa-triangle-exclamation mr-2"></i> Firestore Belum Diizinkan di Console.</span>`;
            }
        }

        window.seedDatabase = async function() {
            const btn = document.getElementById('btn-seed');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Mengisi Data...';

            const sampleUsers = [
                { username: "mnur", password: "123", full_name: "Mohammad Nur, S.Si., M.T.", nip_nidn: "198501012010121001", roles: ["kaprodi", "dosen"], prodi: "D4 Teknik Otomasi" },
                { username: "ahmad_kajur", password: "123", full_name: "Dr. Eng. Ahmad, S.T., M.T.", nip_nidn: "197802022005011002", roles: ["kajur", "dosen"], prodi: "Jurusan Teknologi Elektro" },
                { username: "siti_sekjur", password: "123", full_name: "Siti Aminah, S.T., M.T.", nip_nidn: "198803032015042001", roles: ["sekjur", "dosen"], prodi: "Jurusan Teknologi Elektro" },
                { username: "dedi_dosen", password: "123", full_name: "Dedi Suherman, M.Tr.T.", nip_nidn: "199004042019031003", roles: ["dosen"], prodi: "D3 Teknik Listrik" },
                { username: "bambang_admin", password: "123", full_name: "Bambang Prasetyo, S.Kom.", nip_nidn: "199205052020011004", roles: ["admin", "tendik"], prodi: "Jurusan Teknologi Elektro" }
            ];

            try {
                for (const u of sampleUsers) {
                    await addDoc(collection(db, "users"), u);
                }
                alert("Berhasil memasukkan data user terdaftar ke Firestore! Coba login dengan username 'mnur' / pass '123'.");
                checkFirebaseConnection();
            } catch (e) {
                alert("Gagal mengisi data: " + e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-database mr-1"></i> Isi Firestore dengan Sample Data User';
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            checkFirebaseConnection();
            const savedUser = localStorage.getItem('sim_jte_session');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                showDashboard();
            }
        });

        window.handleLogin = async function(e) {
            e.preventDefault();
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();
            const errDiv = document.getElementById('login-error');
            const btnLogin = document.getElementById('btn-login');

            btnLogin.disabled = true;
            btnLogin.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Memeriksa DB...';

            try {
                const q = query(collection(db, "users"), where("username", "==", u), where("password", "==", p));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    currentUser = querySnapshot.docs[0].data();
                    errDiv.classList.add('hidden');
                    localStorage.setItem('sim_jte_session', JSON.stringify(currentUser));
                    showDashboard();
                } else {
                    errDiv.classList.remove('hidden');
                }
            } catch (error) {
                alert("Error koneksi: " + error.message);
            } finally {
                btnLogin.disabled = false;
                btnLogin.innerText = 'Masuk ke Sistem';
            }
        };

        window.handleLogout = function() {
            localStorage.removeItem('sim_jte_session');
            currentUser = null;
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
        };

        function renderSidebar() {
            const menu = document.getElementById('sidebar-menu');
            let items = [];

            items.push({ id: 'overview', label: 'Dashboard Overview', icon: 'fa-chart-pie' });
            items.push({ id: 'documents', label: 'Dokumen Jurusan', icon: 'fa-folder-open' });

            if (hasAnyRole(['dosen'])) {
                items.push({ id: 'my_schedules', label: 'Jadwal Mengajar Saya', icon: 'fa-calendar-user' });
                items.push({ id: 'my_bkd', label: 'BKD Personal', icon: 'fa-user-clock' });
                items.push({ id: 'research', label: 'Penelitian & PKM', icon: 'fa-flask' });
                items.push({ id: 'outputs', label: 'Luaran Research & PKM', icon: 'fa-book-bookmark' });
            }

            if (hasAnyRole(['kaprodi'])) {
                items.push({ id: 'manage_schedules', label: 'Plotting Jadwal Prodi', icon: 'fa-calendar-days' });
                items.push({ id: 'achievements', label: 'Prestasi Mhs Prodi', icon: 'fa-trophy' });
                items.push({ id: 'prodi_bkd', label: 'Rekap BKD Prodi', icon: 'fa-chart-simple' });
            }

            if (hasAnyRole(['kajur', 'sekjur'])) {
                items.push({ id: 'achievements', label: 'Verifikasi Prestasi', icon: 'fa-trophy' });
                items.push({ id: 'monitoring_bkd', label: 'Monitoring BKD Jurusan', icon: 'fa-chart-bar' });
                items.push({ id: 'recap_tridharma', label: 'Laporan Tridharma', icon: 'fa-file-invoice' });
            }

            if (hasAnyRole(['tendik'])) {
                items.push({ id: 'my_vault', label: 'Dokumen & Sertifikasi', icon: 'fa-vault' });
            }

            if (hasAnyRole(['admin'])) {
                items.push({ id: 'users', label: 'Manajemen User & Role', icon: 'fa-users-gear' });
                items.push({ id: 'audit_logs', label: 'Audit Log Sistem', icon: 'fa-shield-halved' });
            }

            menu.innerHTML = items.map(item => `
                <button onclick="navigate('${item.id}')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg transition hover:bg-slate-800 text-left">
                    <i class="fa-solid ${item.icon} w-5 text-indigo-400"></i>
                    <span>${item.label}</span>
                </button>
            `).join('');
        }

        function showDashboard() {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');

            document.getElementById('user-display-name').textContent = currentUser.full_name;
            document.getElementById('user-username').textContent = `@${currentUser.username}`;
            document.getElementById('user-avatar').textContent = currentUser.full_name.charAt(0);
            document.getElementById('user-context-info').textContent = `Unit: ${currentUser.prodi}`;

            const badgeContainer = document.getElementById('user-roles-badges');
            badgeContainer.innerHTML = currentUser.roles.map(r => `
                <span class="px-2 py-0.5 rounded bg-indigo-900/80 text-indigo-200 text-[10px] font-bold uppercase tracking-wider border border-indigo-700/50">${r}</span>
            `).join('');

            renderSidebar();
            navigate('overview');
        }

        window.closeModal = function() {
            document.getElementById('modal-container').classList.add('hidden');
        };

        window.openModal = function(htmlContent) {
            document.getElementById('modal-content').innerHTML = htmlContent;
            document.getElementById('modal-container').classList.remove('hidden');
        };

            const title = document.getElementById('page-title');

                        <div>
                            <h4 class="font-bold text-indigo-900">Selamat Datang, ${currentUser.full_name}!</h4>
                            <p class="text-xs text-indigo-700 mt-1">Username: <b>@${currentUser.username}</b> | Hak Akses Role: <b>${currentUser.roles.join(', ').toUpperCase()}</b>.</p>
                        </div>
                        <span class="px-3 py-1 bg-emerald-600 text-white rounded-lg text-xs font-semibold">Live System</span>

                            </div>

                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <h3 class="font-bold text-slate-800 mb-3 text-sm">Jadwal Mengajar Terdekat</h3>
                            <div class="space-y-3">
                                <div class="p-3 bg-slate-50 rounded-lg border border-slate-200 flex justify-between items-center text-xs">
                                    <div>
                                        <p class="font-bold text-slate-800">Sistem Kendali Terprogram (PLC)</p>

                                    </div>
                                    <span class="px-2.5 py-1 bg-indigo-100 text-indigo-700 font-semibold rounded">2A D4-TO</span>

                                <div class="p-3 bg-slate-50 rounded-lg border border-slate-200 flex justify-between items-center text-xs">
                                    <div>
                                        <p class="font-bold text-slate-800">Antarmuka Mesin dan Manusia (HMI)</p>

                                    </div>
                                    <span class="px-2.5 py-1 bg-indigo-100 text-indigo-700 font-semibold rounded">3B D4-TO</span>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <h3 class="font-bold text-slate-800 mb-3 text-sm">Aktivitas & Notifikasi Terbaru</h3>

                                        <span class="text-[10px] text-slate-400">3 jam yang lalu</span>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>
                `;
            } else if (pageId === 'documents') {
                title.textContent = "Dokumen Resmi Jurusan";
                container.innerHTML = `

                        <div class="flex flex-col md:flex-row justify-between md:items-center gap-4 mb-6">

                                <input type="text" placeholder="Cari nomor dokumen atau judul..." class="w-full md:w-80 px-3.5 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
