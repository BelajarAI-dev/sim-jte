<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM-JTE | Program BATERAI - Dashboard Admin</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sidebar-active { background-color: rgba(255, 255, 255, 0.15); border-left: 4px solid #6366f1; }
        .nav-tab-active { border-bottom: 3px solid #3b82f6; color: #1d4ed8; font-weight: 700; background-color: #ffffff; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased">

    <!-- APP CONTAINER -->
    <div id="app" class="min-h-screen flex flex-col">
        
        <!-- LOGIN VIEW -->
        <div id="login-view" class="flex-1 flex items-center justify-center p-4 bg-slate-900">
            <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8 border border-slate-200">
                <div class="text-center mb-6">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-100 text-indigo-600 mb-4">
                        <i class="fa-solid fa-bolt text-3xl"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-slate-900">SIM-JTE System</h1>
                    <p class="text-xs text-slate-500 mt-1">Jurusan Teknologi Elektro</p>
                </div>

                <div id="db-status" class="mb-5 p-2.5 rounded-lg bg-amber-50 text-amber-700 text-xs font-semibold flex items-center justify-between border border-amber-200">
                    <span><i class="fa-solid fa-spinner fa-spin mr-2"></i> Menghubungkan ke Database Firestore...</span>
                </div>

                <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-user"></i></span>
                            <input type="text" id="login-username" required class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none transition text-sm" placeholder="Username terdaftar">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="login-password" required class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none transition text-sm" placeholder="••••••••">
                        </div>
                    </div>

                    <div id="login-error" class="hidden p-3 rounded-lg bg-red-50 text-red-600 text-xs font-medium border border-red-200">
                        Username atau password tidak cocok / salah.
                    </div>

                    <button type="submit" id="btn-login" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md transition duration-200">
                        Masuk ke Sistem
                    </button>
                </form>
            </div>
        </div>

        <!-- MAIN DASHBOARD VIEW -->
        <div id="dashboard-view" class="hidden flex-1 flex flex-col md:flex-row min-h-screen">
            <aside class="w-full md:w-64 bg-slate-900 text-slate-300 flex flex-col justify-between shrink-0">
                <div>
                    <div class="p-5 flex items-center space-x-3 border-b border-slate-800">
                        <i class="fa-solid fa-bolt text-indigo-400 text-2xl"></i>
                        <div>
                            <h2 class="font-bold text-white leading-none">SIM-JTE</h2>
                            <span class="text-xs text-slate-400">Teknologi Elektro</span>
                        </div>
                    </div>
                    <nav class="p-3 space-y-1 text-sm font-medium" id="sidebar-menu"></nav>
                </div>

                <div class="p-4 border-t border-slate-800 bg-slate-950/50">
                    <div class="flex items-center space-x-3 mb-3">
                        <div class="w-9 h-9 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold shrink-0" id="user-avatar">U</div>
                        <div class="overflow-hidden">
                            <p class="text-sm font-semibold text-white truncate" id="user-display-name">User Name</p>
                            <p class="text-[11px] text-slate-400 truncate" id="user-username">@username</p>
                            <div class="flex flex-wrap gap-1 mt-1.5" id="user-roles-badges"></div>
                        </div>
                    </div>
                    <button onclick="handleLogout()" class="w-full py-2 px-3 bg-red-600/20 hover:bg-red-600 text-red-300 hover:text-white rounded-lg text-xs font-semibold flex items-center justify-center space-x-2 transition">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Keluar Sistem</span>
                    </button>
                </div>
            </aside>

            <main class="flex-1 bg-slate-50 flex flex-col overflow-y-auto">
                <header class="bg-white border-b border-slate-200 py-4 px-6 flex items-center justify-between sticky top-0 z-10 shadow-sm">
                    <div>
                        <h1 class="text-xl font-bold text-slate-800" id="page-title">Dashboard Overview</h1>
                        <p class="text-xs text-slate-500" id="user-context-info">Sistem Terintegrasi</p>
                    </div>
                    <span class="text-xs bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full font-semibold border border-indigo-200">
                        T.A. 2026/2027 - Ganjil
                    </span>
                </header>
                <div class="p-6 flex-1" id="main-content"></div>
            </main>
        </div>
    </div>

    <!-- GLOBAL MODAL CONTAINER -->
    <div id="modal-container" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-xl w-full overflow-hidden border border-slate-200 transform transition-all" id="modal-content"></div>
    </div>

    <!-- FIREBASE MODULE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4RAHwt54aAQGD0GWEMkKpi94VdHG7kzY",
            authDomain: "sim-jte.firebaseapp.com",
            projectId: "sim-jte",
            storageBucket: "sim-jte.firebasestorage.app",
            messagingSenderId: "931452325709",
            appId: "1:931452325709:web:576faf724835bb712fb104",
            measurementId: "G-KKHDV3DMCY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = null;
        let activeAdminTab = 'riwayat_iuran';

        function hasAnyRole(allowedRoles) {
            if (!currentUser || !currentUser.roles) return false;
            return currentUser.roles.some(role => allowedRoles.includes(role));
        }

        async function checkFirebaseConnection() {
            const statusDiv = document.getElementById('db-status');
            try {
                const q = query(collection(db, "users"));
                await getDocs(q);
                statusDiv.className = "mb-5 p-2.5 rounded-lg bg-emerald-50 text-emerald-700 text-xs font-semibold flex items-center justify-between border border-emerald-200";
                statusDiv.innerHTML = '<span><i class="fa-solid fa-circle-check mr-2"></i> Cloud Firestore Terhubung</span>';
            } catch (err) {
                console.error(err);
                statusDiv.className = "mb-5 p-2.5 rounded-lg bg-red-50 text-red-700 text-xs font-semibold border border-red-200";
                statusDiv.innerHTML = `<span><i class="fa-solid fa-triangle-exclamation mr-2"></i> Firestore Gagal Terhubung.</span>`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            checkFirebaseConnection();
            const savedUser = localStorage.getItem('sim_jte_session');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                showDashboard();
            }
        });

        window.handleLogin = async function(e) {
            e.preventDefault();
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();
            const errDiv = document.getElementById('login-error');
            const btnLogin = document.getElementById('btn-login');

            btnLogin.disabled = true;
            btnLogin.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Autentikasi...';

            try {
                const q = query(collection(db, "users"), where("username", "==", u), where("password", "==", p));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    currentUser = querySnapshot.docs[0].data();
                    currentUser.docId = querySnapshot.docs[0].id;
                    errDiv.classList.add('hidden');
                    localStorage.setItem('sim_jte_session', JSON.stringify(currentUser));
                    showDashboard();
                } else {
                    errDiv.classList.remove('hidden');
                }
            } catch (error) {
                alert("Gagal autentikasi: " + error.message);
            } finally {
                btnLogin.disabled = false;
                btnLogin.innerText = 'Masuk ke Sistem';
            }
        };

        window.handleLogout = function() {
            localStorage.removeItem('sim_jte_session');
            currentUser = null;
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
        };

        function renderSidebar() {
            const menu = document.getElementById('sidebar-menu');
            let items = [];

            items.push({ id: 'overview', label: 'Dashboard Overview', icon: 'fa-chart-pie' });
            items.push({ id: 'documents', label: 'Dokumen Jurusan', icon: 'fa-folder-open' });

            if (hasAnyRole(['admin', 'superadmin'])) {
                items.push({ id: 'baterai_admin', label: 'Program BATERAI (Admin)', icon: 'fa-hand-holding-hand' });
                items.push({ id: 'users', label: 'Manajemen User & Role', icon: 'fa-users-gear' });
            }

            if (hasAnyRole(['superadmin'])) {
                items.push({ id: 'periode_beasiswa', label: 'Master Periode Beasiswa', icon: 'fa-calendar-range' });
                items.push({ id: 'master_prodi', label: 'Master Prodi', icon: 'fa-sitemap' });
            }

            menu.innerHTML = items.map(item => `
                <button onclick="navigate('${item.id}')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg transition hover:bg-slate-800 text-left">
                    <i class="fa-solid ${item.icon} w-5 text-indigo-400"></i>
                    <span>${item.label}</span>
                </button>
            `).join('');
        }

        function showDashboard() {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');

            document.getElementById('user-display-name').textContent = currentUser.full_name || currentUser.nama;
            document.getElementById('user-username').textContent = `@${currentUser.username}`;
            document.getElementById('user-avatar').textContent = (currentUser.full_name || currentUser.nama) ? (currentUser.full_name || currentUser.nama).charAt(0) : 'A';
            document.getElementById('user-context-info').textContent = `Unit: ${currentUser.prodi || 'Jurusan'}`;

            const badgeContainer = document.getElementById('user-roles-badges');
            badgeContainer.innerHTML = (currentUser.roles || [currentUser.role]).map(r => `
                <span class="px-2 py-0.5 rounded bg-indigo-900/80 text-indigo-200 text-[10px] font-bold uppercase tracking-wider border border-indigo-700/50">${r}</span>
            `).join('');

            renderSidebar();
            navigate('baterai_admin');
        }

        window.closeModal = function() {
            document.getElementById('modal-container').classList.add('hidden');
        };

        window.openModal = function(htmlContent) {
            document.getElementById('modal-content').innerHTML = htmlContent;
            document.getElementById('modal-container').classList.remove('hidden');
        };

        // ROUTER
        window.navigate = async function(pageId) {
            const container = document.getElementById('main-content');
            const title = document.getElementById('page-title');

            if (pageId === 'baterai_admin') {
                title.textContent = "Pengelolaan Program BATERAI JTE (Role Admin)";
                renderBateraiAdminView(container);
            } else if (pageId === 'overview') {
                title.textContent = "Dashboard Overview";
                container.innerHTML = `<div class="p-6 bg-white rounded-2xl border border-slate-200">Halaman Dashboard Utama SIM-JTE</div>`;
            } else if (pageId === 'users') {
                title.textContent = "Manajemen User & Hak Akses (RBAC)";
                container.innerHTML = `<div class="p-6 bg-white rounded-2xl border border-slate-200">Modul Manajemen User</div>`;
            } else {
                title.textContent = pageId.replace('_', ' ').toUpperCase();
                container.innerHTML = `<div class="p-6 bg-white rounded-2xl border border-slate-200">Modul <b>${pageId}</b>.</div>`;
            }
        };

        // RENDERER KHUSUS ADMIN BATERAI
        async function renderBateraiAdminView(container) {
            let totalPemasukanKas = 0;
            let totalPengeluaranKas = 0;

            try {
                const iuranSnap = await getDocs(collection(db, "baterai_iuran"));
                const alokasiSnap = await getDocs(collection(db, "baterai_alokasi"));

                iuranSnap.forEach(doc => { totalPemasukanKas += Number(doc.data().jumlah || 0); });
                alokasiSnap.forEach(doc => { totalPengeluaranKas += Number(doc.data().nominal || 0); });
            } catch(e) { console.error(e); }

            const saldoAkhir = totalPemasukanKas - totalPengeluaranKas;

            container.innerHTML = `
                <!-- REKENING BANNER (SAMA SEPERTI GAMBAR REFERENSI) -->
                <div class="mb-4 p-3.5 bg-sky-100 border border-sky-300 rounded-xl text-xs text-slate-800 flex items-center space-x-3 shadow-sm">
                    <div class="w-8 h-8 rounded-lg bg-sky-200 text-sky-700 flex items-center justify-center shrink-0 text-base">
                        <i class="fa-solid fa-building-columns"></i>
                    </div>
                    <div>
                        <p class="font-bold text-sky-900"><i class="fa-regular fa-credit-card mr-1"></i> Rekening Transfer Iuran (Bank MANDIRI)</p>
                        <p class="mt-0.5">Bank MANDIRI &bull; Nomor Rekening: <span class="bg-blue-600 text-white font-bold px-2 py-0.5 rounded text-[11px]">1400020926979</span> &bull; a.n. <strong>Siti Aminah</strong></p>
                    </div>
                </div>

                <!-- 3 METRIC CARDS ADMIN (HIJAU, MERAH, BIRU - GAMBAR 1-5) -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-6">
                    <div class="p-5 bg-emerald-600 text-white rounded-2xl shadow-sm">
                        <p class="text-xs font-semibold opacity-90">Total Pemasukan Kas</p>
                        <p class="text-3xl font-extrabold mt-1">Rp ${totalPemasukanKas.toLocaleString('id-ID')}</p>
                    </div>
                    <div class="p-5 bg-rose-600 text-white rounded-2xl shadow-sm">
                        <p class="text-xs font-semibold opacity-90">Total Pengeluaran Kas</p>
                        <p class="text-3xl font-extrabold mt-1">Rp ${totalPengeluaranKas.toLocaleString('id-ID')}</p>
                    </div>
                    <div class="p-5 bg-blue-600 text-white rounded-2xl shadow-sm">
                        <p class="text-xs font-semibold opacity-90">Saldo Akhir Kas Keseluruhan</p>
                        <p class="text-3xl font-extrabold mt-1">Rp ${saldoAkhir.toLocaleString('id-ID')}</p>
                    </div>
                </div>

                <!-- NAV TABS ADMIN BATERAI (5 MENU - GAMBAR 1-5) -->
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="flex border-b border-slate-200 bg-slate-50/50 text-xs font-semibold text-slate-600 overflow-x-auto">
                        <button onclick="switchAdminTab('riwayat_iuran')" id="admin-tab-riwayat_iuran" class="px-5 py-3.5 transition flex items-center space-x-2 ${activeAdminTab === 'riwayat_iuran' ? 'nav-tab-active' : 'hover:text-slate-900'}">
                            <span>Riwayat Iuran</span>
                        </button>
                        <button onclick="switchAdminTab('monitor_iuran')" id="admin-tab-monitor_iuran" class="px-5 py-3.5 transition flex items-center space-x-2 ${activeAdminTab === 'monitor_iuran' ? 'nav-tab-active' : 'hover:text-slate-900'}">
                            <i class="fa-solid fa-table-cells text-blue-500"></i>
                            <span>Monitor Iuran</span>
                        </button>
                        <button onclick="switchAdminTab('input_iuran')" id="admin-tab-input_iuran" class="px-5 py-3.5 transition flex items-center space-x-2 ${activeAdminTab === 'input_iuran' ? 'nav-tab-active' : 'hover:text-slate-900'}">
                            <span>Input Iuran / Rapel</span>
                        </button>
                        <button onclick="switchAdminTab('pengelolaan_dana')" id="admin-tab-pengelolaan_dana" class="px-5 py-3.5 transition flex items-center space-x-2 ${activeAdminTab === 'pengelolaan_dana' ? 'nav-tab-active' : 'hover:text-slate-900'}">
                            <span>Pengelolaan Dana Beasiswa</span>
                        </button>
                        <button onclick="switchAdminTab('laporan_keuangan')" id="admin-tab-laporan_keuangan" class="px-5 py-3.5 transition flex items-center space-x-2 ${activeAdminTab === 'laporan_keuangan' ? 'nav-tab-active' : 'hover:text-slate-900'}">
                            <span>Laporan Keuangan</span>
                        </button>
                    </div>

                    <!-- ADMIN TAB CONTENT CONTAINER -->
                    <div class="p-6" id="admin-tab-content">
                        <p class="text-xs text-slate-400">Memuat modul admin...</p>
                    </div>
                </div>
            `;

            renderAdminTabBody();
        }

        window.switchAdminTab = function(tabName) {
            activeAdminTab = tabName;
            document.querySelectorAll('[id^="admin-tab-"]').forEach(btn => {
                btn.className = "px-5 py-3.5 transition flex items-center space-x-2 hover:text-slate-900";
            });
            const activeBtn = document.getElementById(`admin-tab-${tabName}`);
            if (activeBtn) activeBtn.className = "px-5 py-3.5 transition flex items-center space-x-2 nav-tab-active";
            renderAdminTabBody();
        };

        async function renderAdminTabBody() {
            const container = document.getElementById('admin-tab-content');
            if (!container) return;

            // TAB 1: RIWAYAT IURAN (GAMBAR 1)
            if (activeAdminTab === 'riwayat_iuran') {
                container.innerHTML = `
                    <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-3 text-xs">
                        <div class="flex items-center space-x-2">
                            <span>Tampilkan:</span>
                            <select class="px-2 py-1 border rounded outline-none"><option>5</option><option>10</option></select>
                            <span>baris per halaman</span>
                        </div>
                        <div class="relative w-full md:w-64">
                            <input type="text" placeholder="Cari data..." class="w-full pl-8 pr-3 py-1.5 border rounded-lg outline-none text-xs">
                            <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2 text-slate-400"></i>
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr class="border-b border-slate-200 text-slate-700 font-bold bg-slate-50">
                                    <th class="p-3">ID <i class="fa-solid fa-arrow-up-long text-slate-400"></i><i class="fa-solid fa-arrow-down-long text-slate-400"></i></th>
                                    <th class="p-3">Nama Penyumbang <i class="fa-solid fa-arrow-up-long text-slate-400"></i><i class="fa-solid fa-arrow-down-long text-slate-400"></i></th>
                                    <th class="p-3">Tanggal <i class="fa-solid fa-arrow-up-long text-slate-400"></i><i class="fa-solid fa-arrow-down-long text-slate-400"></i></th>
                                    <th class="p-3">Periode <i class="fa-solid fa-arrow-up-long text-slate-400"></i><i class="fa-solid fa-arrow-down-long text-slate-400"></i></th>
                                    <th class="p-3">Jumlah <i class="fa-solid fa-arrow-up-long text-slate-400"></i><i class="fa-solid fa-arrow-down-long text-slate-400"></i></th>
                                    <th class="p-3 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-admin-riwayat-iuran" class="divide-y divide-slate-100">
                                <tr><td colspan="6" class="p-4 text-center text-slate-400">Memuat data riwayat iuran...</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="flex justify-between items-center mt-4 text-xs text-slate-500">
                        <span id="riwayat-count-info">Menampilkan 0 - 0 dari 0 data</span>
                        <div class="flex space-x-1">
                            <button class="px-2.5 py-1 border rounded text-slate-400" disabled>&lt; Prev</button>
                            <button class="px-2.5 py-1 bg-blue-600 text-white rounded font-bold">1</button>
                            <button class="px-2.5 py-1 border rounded text-slate-400">&gt; Next</button>
                        </div>
                    </div>
                `;

                try {
                    const snap = await getDocs(collection(db, "baterai_iuran"));
                    const tbody = document.getElementById('tbody-admin-riwayat-iuran');
                    if (snap.empty) {
                        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">Belum ada transaksi iuran terdaftar.</td></tr>`;
                    } else {
                        let idx = 0;
                        tbody.innerHTML = snap.docs.map(d => {
                            idx++;
                            const r = d.data();
                            return `
                                <tr>
                                    <td class="p-3 font-semibold text-slate-700">TRX-${d.id.substring(0, 12).toUpperCase()}</td>
                                    <td class="p-3 font-bold text-slate-800">${r.nama}</td>
                                    <td class="p-3 text-slate-500">${r.tanggal || '1 Okt 2026'}</td>
                                    <td class="p-3">${r.bulan} ${r.tahun}</td>
                                    <td class="p-3 font-bold text-slate-800">Rp ${Number(r.jumlah).toLocaleString('id-ID')}</td>
                                    <td class="p-3 text-center space-x-1">
                                        <button onclick="alert('Fitur Edit ID: ${d.id}')" class="px-2.5 py-1 bg-amber-400 hover:bg-amber-500 text-slate-900 rounded font-bold text-[11px]"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                                        <button onclick="deleteIuranDoc('${d.id}')" class="px-2.5 py-1 bg-rose-600 hover:bg-rose-700 text-white rounded font-bold text-[11px]"><i class="fa-solid fa-trash"></i> Hapus</button>
                                    </td>
                                </tr>
                            `;
                        }).join('');
                        document.getElementById('riwayat-count-info').textContent = `Menampilkan 1 - ${idx} dari ${idx} data`;
                    }
                } catch(e) { console.error(e); }

            // TAB 2: MONITOR IURAN (GAMBAR 2)
            } else if (activeAdminTab === 'monitor_iuran') {
                container.innerHTML = `
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-3">
                        <div class="flex items-center space-x-2 text-blue-600 font-bold text-sm">
                            <i class="fa-regular fa-square-check"></i>
                            <h3>Rekapan Pembayaran Iuran Per Bulan</h3>
                        </div>
                        <div class="flex items-center space-x-2 text-xs">
                            <span class="font-bold text-slate-600">Pilih Tahun:</span>
                            <select class="px-3 py-1.5 border rounded-lg font-bold bg-slate-50 outline-none">
                                <option>2026</option>
                                <option>2027</option>
                            </select>
                        </div>
                    </div>

        // HANDLER AKSI DATABASE FIRESTORE
        window.deleteIuranDoc = async function(id) {
            if (confirm("Apakah Anda yakin ingin menghapus data iuran ini?")) {
                try {
                    await deleteDoc(doc(db, "baterai_iuran", id));
                    alert("Data iuran berhasil dihapus!");
                    renderBateraiAdminView(document.getElementById('main-content'));
                } catch(e) { alert("Gagal menghapus: " + e.message); }
            }
        };

        window.submitFormInputIuran = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-pay');
            btn.disabled = true;

            const selectedMonths = Array.from(document.querySelectorAll('#chk-months-container input:checked')).map(c => c.value);
            if (selectedMonths.length === 0) {
                alert("Pilih minimal satu bulan!");
                btn.disabled = false;
                return;
            }

            const userName = document.getElementById('pay-user').value.split(' (')[0];
            const nominal = parseFloat(document.getElementById('pay-nominal').value);
            const tahun = document.getElementById('pay-tahun').value;

            try {
                for (let bulan of selectedMonths) {
                    await addDoc(collection(db, "baterai_iuran"), {
                        nama: userName,
                        bulan: bulan,
                        tahun: tahun,
                        jumlah: nominal,
                        tanggal: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })
                    });
                }
                alert("Transaksi iuran berhasil disimpan ke Firestore!");
                renderBateraiAdminView(document.getElementById('main-content'));
            } catch(err) {
                alert("Gagal menyimpan iuran: " + err.message);
            } finally {
                btn.disabled = false;
            }
        };

        window.submitFormCairkanBeasiswa = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-cairkan');
            btn.disabled = true;

            const newAlokasi = {
                nrp: document.getElementById('alk-nrp').value.trim(),
                mahasiswa: document.getElementById('alk-nama').value.trim(),
                prodi: document.getElementById('alk-prodi').value,
                nominal: parseFloat(document.getElementById('alk-nominal').value),
                periode: `${document.getElementById('alk-sem').value} ${document.getElementById('alk-thn').value}`,
                created_at: new Date()
            };

            try {

                renderBateraiAdminView(document.getElementById('main-content'));
            } catch(err) {
                alert("Gagal mencatat pencairan: " + err.message);
            } finally {

            }
