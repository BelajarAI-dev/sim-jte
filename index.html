<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM-JTE | Sistem Manajemen Administrasi Jurusan Teknologi Elektro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sidebar-active { background-color: rgba(255, 255, 255, 0.15); border-left: 4px solid #6366f1; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased">

    <!-- APP CONTAINER -->
    <div id="app" class="min-h-screen flex flex-col">
        
        <!-- LOGIN VIEW -->
        <div id="login-view" class="flex-1 flex items-center justify-center p-4 bg-slate-900">
            <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8 border border-slate-200">
                <div class="text-center mb-6">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-100 text-indigo-600 mb-4">
                        <i class="fa-solid fa-microchip text-3xl"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-slate-900">SIM-JTE System</h1>
                    <p class="text-sm text-slate-500 mt-1">Jurusan Teknologi Elektro</p>
                </div>

                <!-- FIREBASE CONNECTION STATUS BADGE -->
                <div id="db-status" class="mb-5 p-2.5 rounded-lg bg-amber-50 text-amber-700 text-xs font-semibold flex items-center justify-between border border-amber-200">
                    <span><i class="fa-solid fa-spinner fa-spin mr-2"></i> Menghubungkan ke Database Firestore...</span>
                </div>

                <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="fa-solid fa-user"></i>
                            </span>
                            <input type="text" id="login-username" required class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm" placeholder="Masukkan username terdaftar">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" id="login-password" required class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm" placeholder="••••••••">
                        </div>
                    </div>

                    <div id="login-error" class="hidden p-3 rounded-lg bg-red-50 text-red-600 text-xs font-medium border border-red-200">
                        Username atau password tidak cocok / tidak ditemukan di database.
                    </div>

                    <button type="submit" id="btn-login" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition duration-200">
                        Masuk ke Sistem
                    </button>
                </form>
            </div>
        </div>

        <!-- MAIN DASHBOARD VIEW -->
        <div id="dashboard-view" class="hidden flex-1 flex flex-col md:flex-row min-h-screen">
            <aside class="w-full md:w-64 bg-slate-900 text-slate-300 flex flex-col justify-between shrink-0">
                <div>
                    <div class="p-5 flex items-center space-x-3 border-b border-slate-800">
                        <i class="fa-solid fa-bolt text-indigo-400 text-2xl"></i>
                        <div>
                            <h2 class="font-bold text-white leading-none">SIM-JTE</h2>
                            <span class="text-xs text-slate-400">Teknologi Elektro</span>
                        </div>
                    </div>
                    <!-- NAV MENU UTAMA -->
                    <nav class="p-3 space-y-1 text-sm font-medium" id="sidebar-menu"></nav>
                </div>

                <div class="p-4 border-t border-slate-800 bg-slate-950/50">
                    <div class="flex items-center space-x-3 mb-3">
                        <div class="w-9 h-9 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold shrink-0" id="user-avatar">U</div>
                        <div class="overflow-hidden">
                            <p class="text-sm font-semibold text-white truncate" id="user-display-name">User Name</p>
                            <p class="text-[11px] text-slate-400 truncate" id="user-username">@username</p>
                            <div class="flex flex-wrap gap-1 mt-1.5" id="user-roles-badges"></div>
                        </div>
                    </div>
                    <button onclick="handleLogout()" class="w-full py-2 px-3 bg-red-600/20 hover:bg-red-600 text-red-300 hover:text-white rounded-lg text-xs font-semibold flex items-center justify-center space-x-2 transition">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Keluar Sistem</span>
                    </button>
                </div>
            </aside>

            <main class="flex-1 bg-slate-50 flex flex-col overflow-y-auto">
                <header class="bg-white border-b border-slate-200 py-4 px-6 flex items-center justify-between sticky top-0 z-10 shadow-sm">
                    <div>
                        <h1 class="text-xl font-bold text-slate-800" id="page-title">Dashboard Overview</h1>
                        <p class="text-xs text-slate-500" id="user-context-info">Sistem Terintegrasi</p>
                    </div>
                    <span class="text-xs bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full font-semibold border border-indigo-200">
                        T.A. 2026/2027 - Ganjil
                    </span>
                </header>
                <div class="p-6 flex-1" id="main-content"></div>
            </main>
        </div>
    </div>

    <!-- GLOBAL MODAL CONTAINER -->
    <div id="modal-container" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-200 transform transition-all" id="modal-content">
            <!-- Dynamic Modal Content Inserted Here -->
        </div>
    </div>

    <!-- FIREBASE MODULE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4RAHwt54aAQGD0GWEMkKpi94VdHG7kzY",
            authDomain: "sim-jte.firebaseapp.com",
            projectId: "sim-jte",
            storageBucket: "sim-jte.firebasestorage.app",
            messagingSenderId: "931452325709",
            appId: "1:931452325709:web:576faf724835bb712fb104",
            measurementId: "G-KKHDV3DMCY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = null;

        function hasAnyRole(allowedRoles) {
            if (!currentUser || !currentUser.roles) return false;
            return currentUser.roles.some(role => allowedRoles.includes(role));
        }

        async function checkFirebaseConnection() {
            const statusDiv = document.getElementById('db-status');
            try {
                const q = query(collection(db, "users"));
                await getDocs(q);
                statusDiv.className = "mb-5 p-2.5 rounded-lg bg-emerald-50 text-emerald-700 text-xs font-semibold flex items-center justify-between border border-emerald-200";
                statusDiv.innerHTML = '<span><i class="fa-solid fa-circle-check mr-2"></i> Cloud Firestore DB Terhubung</span>';
            } catch (err) {
                console.error("Firestore Error:", err);
                statusDiv.className = "mb-5 p-2.5 rounded-lg bg-red-50 text-red-700 text-xs font-semibold flex items-center justify-between border border-red-200";
                statusDiv.innerHTML = `<span><i class="fa-solid fa-triangle-exclamation mr-2"></i> Koneksi Firestore Gagal / Belum Diizinkan.</span>`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            checkFirebaseConnection();
            const savedUser = localStorage.getItem('sim_jte_session');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                showDashboard();
            }
        });

        window.handleLogin = async function(e) {
            e.preventDefault();
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();
            const errDiv = document.getElementById('login-error');
            const btnLogin = document.getElementById('btn-login');

            btnLogin.disabled = true;
            btnLogin.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Memeriksa Database...';

            try {
                const q = query(collection(db, "users"), where("username", "==", u), where("password", "==", p));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    currentUser = querySnapshot.docs[0].data();
                    errDiv.classList.add('hidden');
                    localStorage.setItem('sim_jte_session', JSON.stringify(currentUser));
                    showDashboard();
                } else {
                    errDiv.classList.remove('hidden');
                }
            } catch (error) {
                alert("Gagal melakukan autentikasi database: " + error.message);
            } finally {
                btnLogin.disabled = false;
                btnLogin.innerText = 'Masuk ke Sistem';
            }
        };

        window.handleLogout = function() {
            localStorage.removeItem('sim_jte_session');
            currentUser = null;
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
        };

        function renderSidebar() {
            const menu = document.getElementById('sidebar-menu');
            let items = [];

            items.push({ id: 'overview', label: 'Dashboard Overview', icon: 'fa-chart-pie' });
            items.push({ id: 'documents', label: 'Dokumen Jurusan', icon: 'fa-folder-open' });

            if (hasAnyRole(['dosen'])) {
                items.push({ id: 'my_schedules', label: 'Jadwal Mengajar Saya', icon: 'fa-calendar-user' });
                items.push({ id: 'my_bkd', label: 'BKD Personal', icon: 'fa-user-clock' });
                items.push({ id: 'research', label: 'Penelitian & PKM', icon: 'fa-flask' });
                items.push({ id: 'outputs', label: 'Luaran Research & PKM', icon: 'fa-book-bookmark' });
            }

            // MENU PROGRAM HIBAH BATERAI (DOSEN & TENDIK)
            if (hasAnyRole(['dosen', 'tendik'])) {
                items.push({ id: 'baterai_program', label: 'Program BATERAI', icon: 'fa-hand-holding-hand' });
            }

            if (hasAnyRole(['kaprodi'])) {
                items.push({ id: 'manage_schedules', label: 'Plotting Jadwal Prodi', icon: 'fa-calendar-days' });
                items.push({ id: 'achievements', label: 'Prestasi Mhs Prodi', icon: 'fa-trophy' });
                items.push({ id: 'prodi_bkd', label: 'Rekap BKD Prodi', icon: 'fa-chart-simple' });
            }

            if (hasAnyRole(['kajur', 'sekjur'])) {
                items.push({ id: 'achievements', label: 'Verifikasi Prestasi', icon: 'fa-trophy' });
                items.push({ id: 'monitoring_bkd', label: 'Monitoring BKD Jurusan', icon: 'fa-chart-bar' });
                items.push({ id: 'recap_tridharma', label: 'Laporan Tridharma', icon: 'fa-file-invoice' });
            }

            if (hasAnyRole(['tendik'])) {
                items.push({ id: 'my_vault', label: 'Dokumen & Sertifikasi', icon: 'fa-vault' });
            }

            if (hasAnyRole(['admin'])) {
                items.push({ id: 'users', label: 'Manajemen User & Role', icon: 'fa-users-gear' });
                items.push({ id: 'audit_logs', label: 'Audit Log Sistem', icon: 'fa-shield-halved' });
            }

            menu.innerHTML = items.map(item => `
                <button onclick="navigate('${item.id}')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg transition hover:bg-slate-800 text-left">
                    <i class="fa-solid ${item.icon} w-5 text-indigo-400"></i>
                    <span>${item.label}</span>
                </button>
            `).join('');
        }

        function showDashboard() {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');

            document.getElementById('user-display-name').textContent = currentUser.full_name;
            document.getElementById('user-username').textContent = `@${currentUser.username}`;
            document.getElementById('user-avatar').textContent = currentUser.full_name ? currentUser.full_name.charAt(0) : 'U';
            document.getElementById('user-context-info').textContent = `Unit: ${currentUser.prodi || 'Jurusan'}`;

            const badgeContainer = document.getElementById('user-roles-badges');
            badgeContainer.innerHTML = (currentUser.roles || []).map(r => `
                <span class="px-2 py-0.5 rounded bg-indigo-900/80 text-indigo-200 text-[10px] font-bold uppercase tracking-wider border border-indigo-700/50">${r}</span>
            `).join('');

            renderSidebar();
            navigate('overview');
        }

        window.closeModal = function() {
            document.getElementById('modal-container').classList.add('hidden');
        };

        window.openModal = function(htmlContent) {
            document.getElementById('modal-content').innerHTML = htmlContent;
            document.getElementById('modal-container').classList.remove('hidden');
        };

        // ROUTER & FIRESTORE LIVE DATA RENDERERS
        window.navigate = async function(pageId) {
            const container = document.getElementById('main-content');
            const title = document.getElementById('page-title');

            if (pageId === 'overview') {
                title.textContent = "Dashboard Overview";
                container.innerHTML = `
                    <div class="p-4 bg-indigo-50 border border-indigo-200 rounded-xl mb-6 flex items-center justify-between">
                        <div>
                            <h4 class="font-bold text-indigo-900">Selamat Datang, ${currentUser.full_name}!</h4>
                            <p class="text-xs text-indigo-700 mt-1">Username: <b>@${currentUser.username}</b> | Hak Akses Role: <b>${(currentUser.roles || []).join(', ').toUpperCase()}</b>.</p>
                        </div>
                        <span class="px-3 py-1 bg-emerald-600 text-white rounded-lg text-xs font-semibold">Active Session</span>
                    </div>

                    <div id="overview-metrics" class="grid grid-cols-1 md:grid-cols-4 gap-5 mb-6">
                        <div class="p-4 bg-white rounded-xl border text-center text-xs text-slate-400">Memuat statistik dari Firestore...</div>
                    </div>
                `;

                try {
                    const docsSnap = await getDocs(collection(db, "documents_official"));
                    const achSnap = await getDocs(collection(db, "achievements"));
                    const resSnap = await getDocs(collection(db, "research"));

                    document.getElementById('overview-metrics').innerHTML = `
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-xs font-semibold text-slate-500 uppercase">Dokumen Resmi</p>
                                <p class="text-2xl font-bold text-slate-800 mt-1">${docsSnap.size}</p>
                            </div>
                            <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-lg flex items-center justify-center text-xl"><i class="fa-solid fa-file-contract"></i></div>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-xs font-semibold text-slate-500 uppercase">Prestasi Mhs</p>
                                <p class="text-2xl font-bold text-slate-800 mt-1">${achSnap.size}</p>
                            </div>
                            <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-lg flex items-center justify-center text-xl"><i class="fa-solid fa-award"></i></div>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-xs font-semibold text-slate-500 uppercase">Riset & PKM</p>
                                <p class="text-2xl font-bold text-slate-800 mt-1">${resSnap.size}</p>
                            </div>
                            <div class="w-12 h-12 bg-purple-50 text-purple-600 rounded-lg flex items-center justify-center text-xl"><i class="fa-solid fa-flask"></i></div>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-xs font-semibold text-slate-500 uppercase">Status DB</p>
                                <p class="text-sm font-bold text-emerald-600 mt-1">Live Connected</p>
                            </div>
                            <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center text-xl"><i class="fa-solid fa-database"></i></div>
                        </div>
                    `;
                } catch(e) { console.error(e); }

            } else if (pageId === 'baterai_program') {
                title.textContent = "Program Hibah BATERAI";
                container.innerHTML = `
                    <div class="p-5 bg-gradient-to-r from-indigo-900 to-indigo-700 text-white rounded-2xl shadow-md mb-6">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <span class="px-2.5 py-1 bg-indigo-500/30 border border-indigo-400/40 rounded-full text-[11px] font-bold uppercase tracking-wider text-indigo-200">Bantuan Swadaya Sivitas</span>
                                <h2 class="text-xl font-bold mt-1">BATERAI</h2>
                                <p class="text-xs text-indigo-100 mt-0.5">Bantuan Akademik Teknologi Elektro untuk Riset Akselerasi dan Inovasi Mahasiswa (Sumber Dana: Iuran Dosen & Tendik).</p>
                            </div>
                            <button onclick="openAddBateraiGrantModal()" class="px-4 py-2 bg-white text-indigo-900 hover:bg-indigo-50 font-semibold rounded-lg text-xs transition shadow flex items-center space-x-2">
                                <i class="fa-solid fa-plus-circle text-indigo-600"></i>
                                <span>Ajukan Bantuan Riset Mhs</span>
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-6">
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-semibold text-slate-500 uppercase">Total Dana Swadaya Terkumpul</p>
                            <p class="text-2xl font-bold text-indigo-600 mt-1">Rp 24.500.000</p>
                            <p class="text-[11px] text-slate-400 mt-1">Dari Iuran Rutin Dosen & Tendik JTE</p>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-semibold text-slate-500 uppercase">Dana Tersalurkan ke Mhs</p>
                            <p class="text-2xl font-bold text-emerald-600 mt-1">Rp 16.000.000</p>
                            <p class="text-[11px] text-emerald-600 mt-1 font-semibold"><i class="fa-solid fa-check-circle mr-1"></i>8 Proyek Inovasi Didanai</p>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-semibold text-slate-500 uppercase">Proposal Menunggu Verifikasi</p>
                            <p class="text-2xl font-bold text-amber-600 mt-1">3 Proposal</p>
                            <p class="text-[11px] text-amber-600 mt-1 font-semibold"><i class="fa-solid fa-clock mr-1"></i>Akselerasi Riset TA / Lomba</p>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        <h3 class="font-bold text-slate-800 text-sm mb-4">Daftar Pengajuan Bantuan Riset & Inovasi Mahasiswa</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="bg-slate-100 border-b border-slate-200 text-slate-600 font-semibold">
                                        <th class="p-3">Judul Inovasi / Riset Mhs</th>
                                        <th class="p-3">Mahasiswa Penerima</th>
                                        <th class="p-3">Dosen/Tendik Pembimbing</th>
                                        <th class="p-3">Usulan Dana</th>
                                        <th class="p-3">Status Verifikasi</th>
                                    </tr>
                                </thead>
                                <tbody id="baterai-table-body" class="divide-y divide-slate-100">
                                    <tr><td colspan="5" class="p-4 text-center text-slate-400">Mengambil data BATERAI dari Firestore...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

                // Query Firestore Collection: baterai_grants
                try {
                    const snap = await getDocs(collection(db, "baterai_grants"));
                    const tbody = document.getElementById('baterai-table-body');
                    if (snap.empty) {
                        tbody.innerHTML = `
                            <tr>
                                <td class="p-3">
                                    <p class="font-bold text-slate-800">Sistem Monitoring Baterai LiFePO4 Berbasis IoT untuk PLTS</p>
                                    <p class="text-slate-400">Skema: Riset Akselerasi Tugas Akhir</p>
                                </td>
                                <td class="p-3 font-semibold text-slate-700">Ahmad Fauzi (NIM. 210441100012)</td>
                                <td class="p-3">${currentUser.full_name}</td>
                                <td class="p-3 font-bold text-indigo-600">Rp 2.500.000</td>
                                <td class="p-3"><span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded font-bold">Disetujui & Cair</span></td>
                            </tr>
                            <tr>
                                <td class="p-3">
                                    <p class="font-bold text-slate-800">Pengembangan Modul Kontrol Robot ABU Robocon 2026</p>
                                    <p class="text-slate-400">Skema: Inovasi Kompetisi Mahasiswa</p>
                                </td>
                                <td class="p-3 font-semibold text-slate-700">Tim KRI Elektro (Ketua: Budi S)</td>
                                <td class="p-3">Siti Aminah, M.T.</td>
                                <td class="p-3 font-bold text-indigo-600">Rp 3.500.000</td>
                                <td class="p-3"><span class="px-2 py-0.5 bg-amber-100 text-amber-700 rounded font-bold">Review Tim Pengelola</span></td>
                            </tr>
                        `;
                    } else {
                        tbody.innerHTML = snap.docs.map(doc => {
                            const b = doc.data();
                            return `
                                <tr>
                                    <td class="p-3">
                                        <p class="font-bold text-slate-800">${b.title}</p>
                                        <p class="text-slate-400">Skema: ${b.scheme || 'Riset Akselerasi'}</p>
                                    </td>
                                    <td class="p-3 font-semibold text-slate-700">${b.student_name} (${b.student_nim})</td>
                                    <td class="p-3">${b.mentor_name}</td>
                                    <td class="p-3 font-bold text-indigo-600">Rp ${Number(b.amount).toLocaleString('id-ID')}</td>
                                    <td class="p-3"><span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded font-bold">${b.status || 'Diajukan'}</span></td>
                                </tr>
                            `;
                        }).join('');
                    }
                } catch(e) { console.error(e); }

            } else if (pageId === 'users') {
                title.textContent = "Manajemen User & Hak Akses (RBAC)";
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-slate-800 text-sm">Pengguna Terdaftar di Database</h3>
                            <button onclick="openAddUserModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg text-xs transition">+ Pendaftaran User Baru</button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="bg-slate-100 border-b border-slate-200 text-slate-600 font-semibold">
                                        <th class="p-3">User @Username</th>
                                        <th class="p-3">Nama Lengkap & NIP/NIDN</th>
                                        <th class="p-3">Unit / Prodi</th>
                                        <th class="p-3">Role Fungsional</th>
                                    </tr>
                                </thead>
                                <tbody id="users-table-body" class="divide-y divide-slate-100">
                                    <tr><td colspan="4" class="p-4 text-center text-slate-400">Mengambil data user dari Firestore...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

                try {
                    const snap = await getDocs(collection(db, "users"));
                    const tbody = document.getElementById('users-table-body');
                    if(snap.empty) {
                        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">Belum ada user terdaftar di database.</td></tr>`;
                    } else {
                        tbody.innerHTML = snap.docs.map(doc => {
                            const u = doc.data();
                            return `
                                <tr>
                                    <td class="p-3 font-bold text-indigo-600">@${u.username}</td>
                                    <td class="p-3">
                                        <p class="font-bold text-slate-800">${u.full_name}</p>
                                        <p class="text-slate-400">${u.nip_nidn || '-'}</p>
                                    </td>
                                    <td class="p-3">${u.prodi || 'Jurusan'}</td>
                                    <td class="p-3">
                                        ${(u.roles || []).map(r => `<span class="px-2 py-0.5 bg-slate-800 text-slate-200 rounded font-semibold text-[10px] mr-1">${r}</span>`).join('')}
                                    </td>
                                </tr>
                            `;
                        }).join('');
                    }
                } catch(e) { console.error(e); }

            } else {
                title.textContent = pageId.replace('_', ' ').toUpperCase();
                container.innerHTML = `<div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">Modul <b>${pageId}</b> terhubung langsung dengan Cloud Firestore database.</div>`;
            }
        };

        // MODAL UNTUK PENGAJUAN BANTUAN RISTEK BATERAI
        window.openAddBateraiGrantModal = function() {
            openModal(`
                <div class="p-6">
                    <div class="flex justify-between items-center mb-4 border-b pb-3">
                        <div>
                            <h3 class="font-bold text-slate-800 text-sm">Pengajuan Bantuan Riset BATERAI</h3>
                            <p class="text-[11px] text-slate-500">Iuran Dosen & Tendik untuk Akselerasi Riset Mahasiswa</p>
                        </div>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>
                    <form onsubmit="submitBateraiGrant(event)" class="space-y-3 text-xs">
                        <div>
                            <label class="block font-semibold mb-1 text-slate-700">Judul Inovasi / Riset Mahasiswa</label>
                            <input type="text" id="bat-title" required placeholder="Judul Tugas Akhir / Proyek Inovasi" class="w-full px-3 py-2 border rounded-lg outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-semibold mb-1 text-slate-700">Nama Mahasiswa</label>
                                <input type="text" id="bat-student-name" required placeholder="Nama Mahasiswa" class="w-full px-3 py-2 border rounded-lg outline-none">
                            </div>
                            <div>
                                <label class="block font-semibold mb-1 text-slate-700">NIM Mahasiswa</label>
                                <input type="text" id="bat-student-nim" required placeholder="NIM" class="w-full px-3 py-2 border rounded-lg outline-none">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-semibold mb-1 text-slate-700">Skema Bantuan</label>
                                <select id="bat-scheme" class="w-full px-3 py-2 border rounded-lg outline-none">
                                    <option>Akselerasi Tugas Akhir</option>
                                    <option>Inovasi Lomba / Kompetisi</option>
                                    <option>Publikasi Ilmiah Mahasiswa</option>
                                </select>
                            </div>
                            <div>
                                <label class="block font-semibold mb-1 text-slate-700">Usulan Dana (Rp)</label>
                                <input type="number" id="bat-amount" required placeholder="misal: 2500000" class="w-full px-3 py-2 border rounded-lg outline-none">
                            </div>
                        </div>
                        <div class="flex justify-end space-x-2 border-t pt-4">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-semibold">Batal</button>
                            <button type="submit" id="btn-save-grant" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-semibold">Ajukan ke Firestore</button>
                        </div>
                    </form>
                </div>
            `);
        };

        window.submitBateraiGrant = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-grant');
            btn.disabled = true;

            const newGrant = {
                title: document.getElementById('bat-title').value.trim(),
                student_name: document.getElementById('bat-student-name').value.trim(),
                student_nim: document.getElementById('bat-student-nim').value.trim(),
                scheme: document.getElementById('bat-scheme').value,
                amount: parseFloat(document.getElementById('bat-amount').value),
                mentor_name: currentUser.full_name,
                status: "Diajukan",
                created_at: new Date()
            };

            try {
                await addDoc(collection(db, "baterai_grants"), newGrant);
                alert("Pengajuan hibah BATERAI berhasil disimpan ke database!");
                closeModal();
                navigate('baterai_program');
            } catch (err) {
                alert("Gagal menyimpan pengajuan: " + err.message);
            } finally {
                btn.disabled = false;
            }
        };

        // TAMBAH USER BARU LANGSUNG KE FIRESTORE
        window.openAddUserModal = function() {
            openModal(`
                <div class="p-6">
                    <div class="flex justify-between items-center mb-4 border-b pb-3">
                        <h3 class="font-bold text-slate-800 text-sm">Pendaftaran User Baru ke Database</h3>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>
                    <form id="add-user-form" onsubmit="submitNewUser(event)" class="space-y-3 text-xs">
                        <div>
                            <label class="block font-semibold mb-1 text-slate-700">Username Terdaftar</label>
                            <input type="text" id="new-username" required placeholder="misal: nur_otomasi" class="w-full px-3 py-2 border rounded-lg outline-none">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1 text-slate-700">Password</label>
                            <input type="password" id="new-password" required placeholder="••••••••" class="w-full px-3 py-2 border rounded-lg outline-none">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1 text-slate-700">Nama Lengkap & Gelar</label>
                            <input type="text" id="new-fullname" required placeholder="Nama Lengkap" class="w-full px-3 py-2 border rounded-lg outline-none">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1 text-slate-700">NIP / NIDN</label>
                            <input type="text" id="new-nip" placeholder="Nomor Induk Pegawai" class="w-full px-3 py-2 border rounded-lg outline-none">
                        </div>
                        <div>
                            <label class="block font-semibold mb-1 text-slate-700">Kombinasi Role (Centang):</label>
                            <div class="grid grid-cols-2 gap-2 p-2 bg-slate-50 rounded border" id="role-checkboxes">
                                <label><input type="checkbox" value="dosen"> Dosen</label>
                                <label><input type="checkbox" value="kaprodi"> Kaprodi</label>
                                <label><input type="checkbox" value="kajur"> Kajur</label>
                                <label><input type="checkbox" value="sekjur"> Sekjur</label>
                                <label><input type="checkbox" value="tendik"> Tendik</label>
                                <label><input type="checkbox" value="admin"> Admin System</label>
                            </div>
                        </div>
                        <div class="flex justify-end space-x-2 border-t pt-4">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-semibold">Batal</button>
                            <button type="submit" id="btn-save-user" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-semibold">Simpan ke DB</button>
                        </div>
                    </form>
                </div>
            `);
        };

        window.submitNewUser = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-user');
            btn.disabled = true;

            const selectedRoles = Array.from(document.querySelectorAll('#role-checkboxes input:checked')).map(cb => cb.value);

            const newUser = {
                username: document.getElementById('new-username').value.trim(),
                password: document.getElementById('new-password').value.trim(),
                full_name: document.getElementById('new-fullname').value.trim(),
                nip_nidn: document.getElementById('new-nip').value.trim(),
                roles: selectedRoles.length > 0 ? selectedRoles : ["dosen"],
                prodi: "Jurusan Teknologi Elektro"
            };

            try {
                await addDoc(collection(db, "users"), newUser);
                alert("User baru berhasil ditambahkan ke database Firestore!");
                closeModal();
                navigate('users');
            } catch (err) {
                alert("Gagal menyimpan data: " + err.message);
            } finally {
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
